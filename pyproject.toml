# Virtual workspace root. uv resolves and installs all packages together.
# See Makefile for the day-to-day commands.

[tool.uv.workspace]
members = [
    "packages/core",
    "packages/cli",
    "packages/web",
    "packages/desktop",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: talks to a live database (skipped unless the engine is reachable)",
]
# unit tests are the default; integration runs only when asked for
addopts = "-m 'not integration'"
