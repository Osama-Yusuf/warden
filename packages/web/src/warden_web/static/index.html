<!-- Fonts load non-blocking: the app paints instantly with system fonts and
     upgrades to IBM Plex only when (and if) the webfont arrives. Never blocks
     startup, works fully offline. -->
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'; this.onload=null"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #0b0e14;
  --bg-glow: rgba(88, 166, 255, 0.055);
  --surface: #12161f;
  --surface-2: #171c27;
  --surface-hover: #1c2230;
  --border: #262d3b;
  --border-strong: #333c4e;
  --accent: #58a6ff;
  --accent-bg: #1f6feb;
  --accent-hover: #388bfd;
  --accent-soft: rgba(88, 166, 255, 0.12);
  --text: #c6cedb;
  --text-strong: #eef2f8;
  --text-muted: #7d8798;
  --mono: #e6edf3;
  --success: #3fb950;
  --success-bg: #238636;
  --warning: #d29922;
  --danger: #f85149;
  --danger-bg: #da3633;
  --danger-soft: rgba(248, 81, 73, 0.1);
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  --radius: 8px;
  --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono-font: "IBM Plex Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  font-family: var(--sans);
  font-size: 14px;
  color: var(--text);
  background: var(--bg);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f7f9fc; --bg-glow: rgba(9, 105, 218, 0.05);
    --surface: #ffffff; --surface-2: #f2f5f9; --surface-hover: #eaeef4;
    --border: #d7dde6; --border-strong: #c3ccd8;
    --accent: #0969da; --accent-bg: #0969da; --accent-hover: #0550ae;
    --accent-soft: rgba(9, 105, 218, 0.09);
    --text: #333c48; --text-strong: #14181f; --text-muted: #67717f; --mono: #1f2328;
    --success: #1a7f37; --success-bg: #1a7f37; --warning: #9a6700;
    --danger: #cf222e; --danger-bg: #cf222e; --danger-soft: rgba(207, 34, 46, 0.08);
    --shadow: 0 8px 24px rgba(20, 30, 50, 0.08);
  }
}
:root[data-theme="light"] {
  --bg: #f7f9fc; --bg-glow: rgba(9, 105, 218, 0.05);
  --surface: #ffffff; --surface-2: #f2f5f9; --surface-hover: #eaeef4;
  --border: #d7dde6; --border-strong: #c3ccd8;
  --accent: #0969da; --accent-bg: #0969da; --accent-hover: #0550ae;
  --accent-soft: rgba(9, 105, 218, 0.09);
  --text: #333c48; --text-strong: #14181f; --text-muted: #67717f; --mono: #1f2328;
  --success: #1a7f37; --success-bg: #1a7f37; --warning: #9a6700;
  --danger: #cf222e; --danger-bg: #cf222e; --danger-soft: rgba(207, 34, 46, 0.08);
  --shadow: 0 8px 24px rgba(20, 30, 50, 0.08);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background:
    radial-gradient(1100px 380px at 72% -8%, var(--bg-glow), transparent 70%),
    var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex; flex-direction: column;
}
::selection { background: var(--accent-soft); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 4px; }

/* ── Top bar ── */
.topbar {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  background: color-mix(in srgb, var(--surface) 82%, transparent);
  backdrop-filter: blur(8px);
  flex-wrap: wrap;
  position: sticky; top: 0; z-index: 50;
}
.tb-spacer { flex: 1; }
.brand { display: flex; align-items: center; gap: 9px; }
.tb-select, .tb-input {
  background: var(--bg); color: var(--text); border: 1px solid var(--border);
  padding: 0 10px; border-radius: var(--radius); font-size: 13px;
  font-family: inherit; height: 34px; transition: border-color 0.15s;
}
.tb-select { min-width: 128px; }
.tb-input { width: 138px; }
.tb-select:hover, .tb-input:hover { border-color: var(--border-strong); }
.tb-select:focus, .tb-input:focus { outline: none; border-color: var(--accent); }
.icon-btn {
  height: 34px; min-width: 34px; padding: 0 8px; border-radius: var(--radius);
  border: 1px solid var(--border); background: transparent; cursor: pointer;
  font-size: 15px; line-height: 1; color: var(--text);
  display: inline-flex; align-items: center; justify-content: center;
  transition: background 0.15s, border-color 0.15s;
}
.icon-btn:hover { background: var(--surface-hover); border-color: var(--border-strong); }
.icon-btn svg { width: 17px; height: 17px; display: block; }
.ni { width: 15px; height: 15px; flex-shrink: 0; }
.btn .ni { width: 15px; height: 15px; }
.icon-btn.on { border-color: var(--warning); color: var(--warning); background: color-mix(in srgb, var(--warning) 12%, transparent); }
.brand-logo {
  width: 30px; height: 30px; border-radius: 8px;
  background: linear-gradient(145deg, var(--accent-soft), transparent);
  border: 1px solid var(--border-strong);
  display: flex; align-items: center; justify-content: center;
  color: var(--accent);
}
.brand-logo svg { width: 17px; height: 17px; }
.brand h1 { font-size: 17px; font-weight: 700; color: var(--text-strong); letter-spacing: -0.02em; line-height: 1.1; }
.brand h1 span { color: var(--accent); }
.brand-sub { font-family: var(--mono-font); font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.14em; color: var(--text-muted); }
.topbar .sep { width: 1px; align-self: stretch; margin: 2px 0; background: var(--border); }
.ctl { display: flex; flex-direction: column; gap: 3px; }
.ctl label {
  font-family: var(--mono-font); font-size: 9px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-muted);
  padding-left: 2px;
}
.topbar select, .topbar input {
  background: var(--bg); color: var(--text); border: 1px solid var(--border);
  padding: 6px 10px; border-radius: var(--radius); font-size: 13px;
  font-family: inherit; height: 32px; transition: border-color 0.15s;
}
.topbar select:hover, .topbar input:hover { border-color: var(--border-strong); }
/* Password mask dots come from the font; webfonts can lack the glyph in
   WKWebView and render tofu boxes, so always use the system font for masks. */
input[type="password"] { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.topbar select:focus, .topbar input:focus { outline: none; border-color: var(--accent); }
.creds-cluster { display: flex; gap: 8px; align-items: center; }
.chk {
  display: flex; align-items: center; gap: 5px; height: 32px;
  font-size: 12px; color: var(--text-muted); cursor: pointer; user-select: none;
}
.chk input { accent-color: var(--accent-bg); width: 13px; height: 13px; cursor: pointer; }
.btn {
  padding: 0 14px; height: 32px; border-radius: var(--radius); font-size: 13px;
  font-weight: 500; cursor: pointer; border: 1px solid transparent;
  font-family: inherit; transition: background 0.15s, transform 0.05s, opacity 0.15s;
  display: inline-flex; align-items: center; gap: 6px;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--accent-bg); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-success { background: var(--success-bg); color: #fff; }
.btn-success:hover { opacity: 0.92; }
.btn-danger { background: var(--danger-bg); color: #fff; }
.btn-danger:hover { opacity: 0.9; }
.btn-ghost { background: transparent; color: var(--text); border-color: var(--border); }
.btn-ghost:hover { background: var(--surface-hover); border-color: var(--border-strong); }
.btn-sm { height: 26px; padding: 0 10px; font-size: 12px; }
.conn {
  display: flex; align-items: center; gap: 8px; height: 34px;
  padding: 0 12px; border-radius: 17px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  font-family: var(--mono-font); font-size: 11.5px; color: var(--text-muted);
  max-width: 420px;
}
.conn #connText { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conn-dot { width: 8px; height: 8px; min-width: 8px; border-radius: 50%; background: var(--text-muted); }
.conn-dot.ok { background: var(--success); box-shadow: 0 0 0 0 rgba(63, 185, 80, 0.5); animation: pulse 2.2s infinite; }
.conn-dot.fail { background: var(--danger); }
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(63, 185, 80, 0.45); }
  70% { box-shadow: 0 0 0 7px rgba(63, 185, 80, 0); }
  100% { box-shadow: 0 0 0 0 rgba(63, 185, 80, 0); }
}

/* ── Layout ── */
.main { display: flex; flex: 1; overflow: hidden; }
.sidebar {
  width: 240px; min-width: 240px;
  border-right: 1px solid var(--border);
  overflow-y: auto;
  background: color-mix(in srgb, var(--surface) 45%, transparent);
  display: flex; flex-direction: column;
}
.qf-wrap { padding: 12px 12px 6px; position: relative; }
.qf {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg); border: 1px solid var(--border); border-radius: 9px;
  padding: 0 11px; height: 34px;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.qf:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.qf svg { width: 13px; height: 13px; color: var(--text-muted); flex-shrink: 0; }
.qf input {
  flex: 1; min-width: 0; background: none; border: none; outline: none;
  color: var(--text); font-size: 12.5px; font-family: inherit;
}
.qf input::placeholder { color: var(--text-muted); }
.qf input:disabled { cursor: not-allowed; }
.qf-results {
  position: absolute; left: 12px; right: 12px; top: 44px; z-index: 60;
  background: var(--surface-2); border: 1px solid var(--border-strong);
  border-radius: var(--radius); box-shadow: var(--shadow);
  overflow: hidden; display: none;
}
.qf-results.open { display: block; }
.qf-hit {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 7px 10px; background: none; border: none; cursor: pointer;
  color: var(--text); font-size: 12.5px; font-family: var(--mono-font); text-align: left;
}
.qf-hit:hover, .qf-hit.sel { background: var(--accent-soft); }
.qf-hit svg { width: 12px; height: 12px; color: var(--text-muted); flex-shrink: 0; }
.qf-hit .tag { margin-left: auto; font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); }
.nav-sections { flex: 1; padding: 8px 10px 14px; }
.group-label {
  display: flex; align-items: center; gap: 7px; width: 100%;
  font-size: 10.5px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted);
  margin-top: 4px; padding: 8px 10px; border-radius: 7px;
  background: none; border: none; cursor: pointer; text-align: left;
  transition: color 0.15s, background 0.15s;
}
.group-label:first-child { margin-top: 0; }
.group-label:hover { color: var(--text); background: color-mix(in srgb, var(--surface-hover) 60%, transparent); }
.group-label .chev {
  width: 12px; height: 12px; color: var(--text-muted);
  transition: transform 0.22s cubic-bezier(.4,0,.2,1);
  transform: rotate(90deg);
}
.group-label:hover .chev { color: var(--text); }
.group-label.collapsed .chev { transform: rotate(0deg); }
.group-label .g-count {
  margin-left: auto; font-size: 9.5px; font-weight: 600; letter-spacing: 0;
  color: var(--text-muted); opacity: 0; transition: opacity 0.15s;
}
.group-label.collapsed .g-count { opacity: 0.7; }
/* Smooth height collapse using animatable grid rows */
.nav-group {
  display: grid; grid-template-rows: 1fr;
  transition: grid-template-rows 0.26s cubic-bezier(.4,0,.2,1);
}
.nav-group.collapsed { grid-template-rows: 0fr; }
.nav-group-inner { overflow: hidden; min-height: 0; padding: 2px 0; }
.nav-group.collapsed .nav-group-inner { padding: 0; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  width: 100%; margin: 1px 0; padding: 7px 10px;
  border: none; border-radius: 8px; background: transparent;
  color: var(--text); font-size: 13px; cursor: pointer;
  font-family: inherit; text-align: left; position: relative;
  transition: background 0.14s ease, color 0.14s ease, transform 0.14s ease;
}
.nav-item .ni { width: 16px; height: 16px; color: var(--text-muted); flex-shrink: 0; transition: color 0.14s, transform 0.14s; }
.nav-item span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-item:hover:not(:disabled) { background: var(--surface-hover); }
.nav-item:hover:not(:disabled) .ni { color: var(--accent); transform: scale(1.08); }
.nav-item.active {
  background: linear-gradient(90deg, var(--accent-soft), color-mix(in srgb, var(--accent-soft) 40%, transparent));
  color: var(--text-strong); font-weight: 500;
}
.nav-item.active::before {
  content: ''; position: absolute; left: 0; top: 6px; bottom: 6px;
  width: 3px; border-radius: 0 3px 3px 0; background: var(--accent);
}
.nav-item.active .ni { color: var(--accent); }
.nav-item.danger:hover:not(:disabled) { background: var(--danger-soft); color: var(--danger); }
.nav-item.danger:hover:not(:disabled) .ni { color: var(--danger); }
.nav-item:disabled { opacity: 0.3; cursor: not-allowed; }
.nav-badge {
  margin-left: auto; font-family: var(--mono-font); font-size: 10px;
  background: var(--surface-hover); border: 1px solid var(--border);
  color: var(--text-muted); border-radius: 9px; padding: 1px 7px;
}
.nav-item.active .nav-badge { border-color: transparent; background: var(--accent-soft); color: var(--accent); }
.sidebar-foot {
  padding: 11px 16px; border-top: 1px solid var(--border);
  font-family: var(--mono-font); font-size: 10.5px; color: var(--text-muted);
  display: flex; align-items: center; gap: 8px; line-height: 1.5;
}
.sidebar-foot svg { width: 12px; height: 12px; flex-shrink: 0; }
.content { flex: 1; overflow-y: auto; padding: 22px 26px; }
.content-inner { max-width: 1200px; }

/* ── Cards & tables ── */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 18px; margin-bottom: 16px;
  animation: rise 0.22s ease;
}
@keyframes rise { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
.card h2 {
  font-size: 15px; font-weight: 600; color: var(--text-strong);
  margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
}
.card h2 .ni { width: 16px; height: 16px; color: var(--accent); }
.card.onboard {
  border-color: color-mix(in srgb, var(--accent) 30%, var(--border));
  background: linear-gradient(160deg, var(--accent-soft), transparent 60%), var(--surface);
}
.onboard-hero { padding: 30px 28px; text-align: center; }
.onboard-logo {
  width: 54px; height: 54px; margin: 0 auto 14px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center; color: var(--accent);
  background: linear-gradient(145deg, var(--accent-soft), transparent);
  border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--border));
}
.onboard-logo svg { width: 28px; height: 28px; }
.onboard-title { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; color: var(--text-strong); margin-bottom: 8px; }
.onboard-lead { font-size: 14px; line-height: 1.6; color: var(--text-muted); max-width: 620px; margin: 0 auto 22px; }
.onboard-steps { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.ob-step {
  display: flex; align-items: flex-start; gap: 10px; text-align: left;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px 14px; width: 210px;
}
.ob-num {
  flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%;
  background: var(--accent-bg); color: #fff; font-size: 12px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.ob-step b { display: block; font-size: 13px; color: var(--text-strong); font-weight: 600; }
.ob-step span { font-size: 11.5px; color: var(--text-muted); line-height: 1.4; }
.card-meta { font-size: 12px; color: var(--text-muted); margin: -6px 0 12px; }
.table-wrap { overflow: auto; max-height: 68vh; border: 1px solid var(--border); border-radius: var(--radius); }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th {
  text-align: left; font-family: var(--mono-font); font-size: 10px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted);
  padding: 8px 12px; border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: var(--surface-2); z-index: 5;
}
td { padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
tbody tr:last-child td { border-bottom: none; }
tbody tr { transition: background 0.1s; }
tbody tr:hover td { background: var(--surface-hover); }
.mono { font-family: var(--mono-font); font-size: 12px; color: var(--mono); }
.pill {
  display: inline-block; padding: 2px 8px; border-radius: 12px;
  font-size: 11px; font-weight: 500;
}
.pill-ok { background: color-mix(in srgb, var(--success) 18%, transparent); color: var(--success); }
.pill-warn { background: color-mix(in srgb, var(--warning) 18%, transparent); color: var(--warning); }
.pill-danger { background: color-mix(in srgb, var(--danger) 18%, transparent); color: var(--danger); }
.pill-muted { background: color-mix(in srgb, var(--text-muted) 14%, transparent); color: var(--text-muted); }
.pill-accent { background: var(--accent-soft); color: var(--accent); }

/* ── Forms ── */
.form-row { display: flex; gap: 12px; align-items: flex-end; margin-bottom: 14px; flex-wrap: wrap; }
.form-field { display: flex; flex-direction: column; gap: 4px; }
.form-field label {
  font-family: var(--mono-font); font-size: 9.5px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted);
}
.form-field input, .form-field select {
  padding: 0 10px; height: 32px; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--bg); color: var(--text); font-size: 13px; font-family: inherit;
  min-width: 170px; transition: border-color 0.15s;
}
.form-field input:hover, .form-field select:hover { border-color: var(--border-strong); }
.form-field input:focus, .form-field select:focus { outline: none; border-color: var(--accent); }

/* ── Stat chips (welcome) ── */
.chips { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.chip {
  display: flex; flex-direction: column; gap: 2px;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 10px 14px; min-width: 140px;
}
.chip .k { font-family: var(--mono-font); font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); }
.chip .v { font-size: 13.5px; font-weight: 600; color: var(--text-strong); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 300px; }
.chip .v.mono { font-size: 12px; font-weight: 500; }

/* ── Modal ── */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(3, 6, 12, 0.66);
  backdrop-filter: blur(3px);
  z-index: 100; align-items: center; justify-content: center;
}
.modal-overlay.open { display: flex; }
#panelModal { z-index: 95; }
#modal { z-index: 120; }
.modal {
  background: var(--surface); border: 1px solid var(--border-strong);
  border-radius: 12px; padding: 24px; max-width: 480px; width: 90%;
  box-shadow: var(--shadow); animation: pop 0.16s ease;
}
.modal-wide { max-width: 780px; max-height: 86vh; overflow-y: auto; position: relative; padding: 24px 26px; }
.modal-x {
  position: absolute; top: 14px; right: 16px; width: 30px; height: 30px;
  border: none; background: transparent; color: var(--text-muted);
  font-size: 22px; line-height: 1; cursor: pointer; border-radius: 7px; z-index: 2;
}
.modal-x:hover { background: rgba(248,81,73,0.12); color: var(--danger); }
.modal-wide .card { border: none; padding: 0; margin: 0; background: none; animation: none; }
.modal-wide h2:first-child { margin-top: 0; padding-right: 34px; }
.stat-strip { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.stat-strip .chip { flex: 1; min-width: 120px; }
@keyframes pop { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: none; } }
.modal h3 { font-size: 16px; font-weight: 600; color: var(--text-strong); margin-bottom: 12px; }
.modal p { font-size: 13px; color: var(--text-muted); margin-bottom: 16px; line-height: 1.55; }
.modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

/* ── Toast ── */
.toast-container { position: fixed; top: 68px; right: 16px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
.toast {
  padding: 10px 15px; border-radius: var(--radius);
  font-size: 13px; color: #fff; max-width: 380px;
  animation: slideIn 0.2s ease-out;
  display: flex; align-items: center; gap: 9px;
  box-shadow: var(--shadow);
}
.toast::before { font-weight: 700; font-size: 12px; }
.toast-success { background: var(--success-bg); } .toast-success::before { content: '✓'; }
.toast-error { background: var(--danger-bg); } .toast-error::before { content: '✕'; }
.toast-info { background: var(--accent-bg); } .toast-info::before { content: 'ℹ'; }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* ── Password display ── */
.password-box {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg); border: 1px solid var(--border-strong); border-radius: var(--radius);
  padding: 9px 12px; margin: 8px 0;
}
.password-box code { flex: 1; font-family: var(--mono-font); font-size: 13px; color: var(--warning); word-break: break-all; }
.copy-btn { cursor: pointer; color: var(--text-muted); background: none; border: none; font-size: 14px; padding: 4px; }
.copy-btn:hover { color: var(--accent); }

/* ── Size bars & sortable headers ── */
.sizebar {
  height: 4px; width: 150px; max-width: 100%;
  background: color-mix(in srgb, var(--border) 55%, transparent);
  border-radius: 2px; overflow: hidden; margin-top: 5px;
}
.sizebar > div {
  height: 100%; border-radius: 2px; min-width: 1px;
  background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--success)));
}
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--text); }
th.sortable .arrow { font-size: 8px; margin-left: 3px; }

/* ── Loader & skeleton ── */
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border);
  border-top-color: var(--accent); border-radius: 50%; animation: spin 0.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-msg { display: flex; align-items: center; gap: 9px; color: var(--text-muted); font-size: 13px; padding: 4px 0 14px; }
.skel {
  height: 13px; border-radius: 4px; margin-bottom: 10px;
  background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface-hover) 50%, var(--surface-2) 75%);
  background-size: 200% 100%; animation: shimmer 1.3s infinite;
}
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.empty-state {
  padding: 28px; text-align: center; color: var(--text-muted); font-size: 13px;
  border: 1px dashed var(--border); border-radius: var(--radius);
}

/* ── Data browser (grid) ── */
#dataModal { z-index: 130; align-items: stretch; justify-content: center; padding: 3vh 3vw; }
#cellModal { z-index: 140; }
.data-modal {
  background: var(--surface); border: 1px solid var(--border-strong);
  border-radius: 12px; box-shadow: var(--shadow);
  width: 100%; max-width: 1680px; height: 100%;
  display: flex; flex-direction: column; overflow: hidden; animation: pop 0.16s ease;
}
.dg-head {
  display: flex; align-items: center; gap: 14px; padding: 14px 18px;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.dg-title { display: flex; align-items: baseline; gap: 9px; min-width: 0; }
.dg-title .name { font-family: var(--mono-font); font-size: 13.5px; font-weight: 600; color: var(--text-strong);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dg-title .badge { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--accent); background: rgba(88,166,255,0.12); padding: 2px 7px; border-radius: 5px; flex-shrink: 0; }
.dg-tools { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-shrink: 0; }
.dg-tools select { height: 30px; }
.dg-stats { display: flex; gap: 10px; padding: 12px 18px; flex-wrap: wrap; flex-shrink: 0;
  border-bottom: 1px solid var(--border); background: var(--surface); }
.dg-stats:empty { display: none; }
.dg-stat { display: flex; flex-direction: column; gap: 3px; min-width: 96px;
  padding: 8px 15px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px; }
.dg-stat .k { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
.dg-stat .v { font-size: 15px; font-weight: 600; color: var(--text-strong); font-variant-numeric: tabular-nums; }
.dg-body { flex: 1; overflow: auto; position: relative; background: var(--bg); }
table.dgrid { border-collapse: separate; border-spacing: 0; font-size: 12.5px; width: max-content; min-width: 100%; }
table.dgrid thead th {
  position: sticky; top: 0; z-index: 3; background: var(--surface-2);
  color: var(--text-muted); text-align: left; font-weight: 600;
  padding: 8px 12px; border-bottom: 1px solid var(--border-strong); border-right: 1px solid var(--border);
  white-space: nowrap; text-transform: none; letter-spacing: 0;
}
table.dgrid thead th .coltype { color: var(--text-muted); opacity: 0.6; font-weight: 400; font-size: 10.5px; margin-left: 6px; }
table.dgrid thead th.dg-corner { left: 0; z-index: 5; width: 1%; }
table.dgrid td {
  padding: 6px 12px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border);
  max-width: 420px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  color: var(--text); font-family: var(--mono-font);
}
table.dgrid td.dg-cell { cursor: pointer; }
table.dgrid tbody tr:hover > td { background: var(--surface-hover); }
.dg-rownum {
  position: sticky; left: 0; z-index: 2; background: var(--surface-2);
  color: var(--text-muted); text-align: right; font-size: 11px; user-select: none; width: 1%;
}
table.dgrid tbody tr:hover .dg-rownum { background: var(--surface-hover); }
.dg-null { color: var(--text-muted); font-style: italic; opacity: 0.65; }
.dg-num { color: var(--accent); }
.dg-bool { display: inline-block; padding: 0 7px; border-radius: 10px; font-size: 11px;
  font-family: var(--font); line-height: 17px; }
.dg-bool.t { background: rgba(63,185,80,0.16); color: var(--success); }
.dg-bool.f { color: var(--text-muted); background: var(--surface-hover); }
.dg-json { color: var(--warning); }
.dg-empty { color: var(--text-muted); }
.dg-foot {
  display: flex; align-items: center; gap: 14px; padding: 9px 18px;
  border-top: 1px solid var(--border); flex-shrink: 0; font-size: 12px; color: var(--text-muted);
}
.dg-foot .count { font-variant-numeric: tabular-nums; }
.dg-pager { display: flex; align-items: center; gap: 6px; margin-left: auto; }
.dg-pager .range { font-variant-numeric: tabular-nums; min-width: 130px; text-align: right; }
.dg-skelrow td { padding: 7px 12px; }
.cell-view { max-width: 720px; width: 90%; }
.cell-view pre {
  background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 12px 14px; font-family: var(--mono-font); font-size: 12.5px; line-height: 1.55;
  color: var(--mono); max-height: 60vh; overflow: auto; white-space: pre-wrap; word-break: break-word;
}

/* search box in the grid toolbar */
.dg-search { display: flex; align-items: center; gap: 5px; height: 30px; padding: 0 8px;
  background: var(--bg); border: 1px solid var(--border); border-radius: 7px; }
.dg-search svg { width: 13px; height: 13px; color: var(--text-muted); flex-shrink: 0; }
.dg-search input { border: none; background: none; outline: none; color: var(--text);
  font-size: 12.5px; width: 150px; }
.dg-search-x { border: none; background: none; color: var(--text-muted); cursor: pointer;
  font-size: 16px; line-height: 1; padding: 0 2px; }
.dg-search-x:hover { color: var(--text); }
.dg-lockbtn { border-color: var(--border-strong); }
.dg-editbtn { background: var(--warning); color: #1a1205; border: 1px solid var(--warning); font-weight: 600; }
.dg-editbtn:hover { filter: brightness(1.08); }
.dg-tag { display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em;
  padding: 1px 6px; border-radius: 4px; background: var(--surface-hover); color: var(--text-muted); }
.dg-tag.warn { background: rgba(210,153,34,0.16); color: var(--warning); }

/* per-row action buttons (only when unlocked) */
table.dgrid thead th.dg-actcol { position: sticky; left: 0; z-index: 4; width: 1%; }
.dg-actions { position: sticky; left: 0; z-index: 2; background: var(--surface-2);
  white-space: nowrap; padding: 0 10px; }
table.dgrid tbody tr:hover .dg-actions { background: var(--surface-hover); }
/* refined segmented action control — subtle by default, lifts on row hover */
.dg-actwrap { display: inline-flex; align-items: center; padding: 2px;
  border-radius: 9px; background: var(--bg); border: 1px solid var(--border);
  opacity: 0.55; transition: opacity .14s ease, border-color .14s ease, box-shadow .14s ease; }
table.dgrid tbody tr:hover .dg-actwrap {
  opacity: 1; border-color: var(--border-strong);
  box-shadow: 0 1px 4px rgba(0,0,0,0.18); }
.dg-actsep { width: 1px; height: 15px; background: var(--border); margin: 0 1px; }
.dg-act { width: 27px; height: 23px; display: inline-flex; align-items: center; justify-content: center;
  border: none; background: none; cursor: pointer; color: var(--text-muted);
  border-radius: 7px; transition: background .12s ease, color .12s ease; }
.dg-act svg { width: 14px; height: 14px; }
.dg-act:hover { background: var(--surface-hover); color: var(--accent); }
.dg-act.danger:hover { color: var(--danger); background: rgba(248,81,73,0.14); }

/* reusable icon button — square, tooltip via title, color by variant */
.ibtn { display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; padding: 0; flex-shrink: 0;
  border: 1px solid transparent; background: transparent; color: var(--text-muted);
  border-radius: 7px; cursor: pointer; transition: background .13s, color .13s, border-color .13s; }
.ibtn svg { width: 16px; height: 16px; }
.ibtn:hover { background: var(--surface-hover); color: var(--text-strong); }
.ibtn:disabled { opacity: 0.4; cursor: default; }
.ibtn:disabled:hover { background: transparent; color: var(--text-muted); }
.ibtn.accent:hover { color: var(--accent); background: rgba(88,166,255,0.12); }
.ibtn.success { color: var(--success); }
.ibtn.success:hover { color: var(--success); background: rgba(63,185,80,0.15); }
.ibtn.danger:hover { color: var(--danger); background: rgba(248,81,73,0.12); }
.ibtn.warn { color: var(--warning); }
.ibtn.warn:hover { color: var(--warning); background: rgba(210,153,34,0.16); }
.ibtn.teal:hover { color: #17b8a6; background: rgba(23,184,166,0.15); }
.ibtn.violet:hover { color: #a689f2; background: rgba(166,137,242,0.16); }
/* "on" state: e.g. editing unlocked */
.ibtn.on { color: var(--warning); background: rgba(210,153,34,0.15); border-color: rgba(210,153,34,0.35); }
.ibtn.on:hover { background: rgba(210,153,34,0.22); }
.row-acts { display: inline-flex; gap: 4px; justify-content: flex-end; width: 100%; }

/* Custom tooltip — instant + styled (native title is slow and unthemed) */
.tooltip { position: fixed; z-index: 9999; max-width: 300px; pointer-events: none;
  background: var(--text-strong); color: var(--surface);
  font-size: 11.5px; font-weight: 500; line-height: 1.4; padding: 4px 9px; border-radius: 6px;
  white-space: nowrap; box-shadow: var(--shadow); opacity: 0;
  transform: translate(-50%, calc(-100% - 7px)); transition: opacity .1s ease; }
.tooltip.show { opacity: 1; }
.tooltip.below { transform: translate(-50%, 7px); }

/* Collapsible sections (Connections / Data) */
.sect { border: 1px solid var(--border); border-radius: 12px; background: var(--surface);
  margin-bottom: 14px; overflow: hidden; }
.sect > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px;
  padding: 15px 18px; user-select: none; transition: background .12s; }
.sect > summary::-webkit-details-marker { display: none; }
.sect > summary:hover { background: var(--surface-2); }
.sect-ic { color: var(--accent); display: inline-flex; }
.sect-ic svg { width: 17px; height: 17px; }
.sect-title { font-size: 15px; font-weight: 600; color: var(--text-strong); }
.sect-badge { font-size: 11px; color: var(--text-muted); background: var(--surface-2);
  border: 1px solid var(--border); padding: 1px 8px; border-radius: 10px; font-variant-numeric: tabular-nums; }
.sect-spacer { flex: 1; }
.sect-add { margin-right: 2px; }
.sect-chev { color: var(--text-muted); display: inline-flex; transition: transform .2s ease; }
.sect-chev svg { width: 16px; height: 16px; }
.sect[open] > summary .sect-chev { transform: rotate(90deg); }
.sect-body { padding: 6px 18px 18px; border-top: 1px solid var(--border); }
.subsect { padding: 16px 0; }
.subsect:first-child { padding-top: 14px; }
.subsect:last-child { padding-bottom: 2px; }
.subsect + .subsect { border-top: 1px solid var(--border); }
.subsect-title { font-size: 13.5px; font-weight: 600; margin: 0 0 6px; display: flex; align-items: center; gap: 8px; color: var(--text-strong); }
.subsect-title svg { width: 15px; height: 15px; }
.subsect-title.danger { color: var(--danger); }
.conn-empty { text-align: center; padding: 34px 20px 30px; }
.conn-empty-ic { color: var(--text-muted); opacity: 0.45; margin-bottom: 10px; }
.conn-empty-ic svg { width: 34px; height: 34px; }
.conn-empty p { color: var(--text-muted); margin: 0 0 14px; font-size: 13.5px; }

/* Add/edit connection modal */
#connModal { z-index: 150; }
.conn-modal { max-width: 470px; width: 92%; max-height: 88vh; overflow-y: auto; position: relative; }
.conn-form { display: flex; flex-direction: column; gap: 13px; }
.conn-form .form-field { display: flex; flex-direction: column; gap: 5px; }
.conn-form .form-field label { font-size: 12px; color: var(--text-muted); }
.conn-form .form-field input, .conn-form select { height: 36px; width: 100%; box-sizing: border-box;
  background: var(--bg); color: var(--text); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 0 10px; font-size: 13px; }
.conn-form .form-field input:focus, .conn-form select:focus { outline: none; border-color: var(--accent); }
.conn-row { display: flex; gap: 12px; }
.conn-row .form-field { flex: 1; }
.conn-checks { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.conn-checks .chk { white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; margin: 0; cursor: pointer; }
.conn-checks input[type=checkbox] { width: 15px; height: 15px; flex-shrink: 0; margin: 0; }

/* add/edit form */
#dgFormModal { z-index: 150; }
.dg-form { max-width: 620px; width: 92%; max-height: 86vh; overflow-y: auto; position: relative; }
.dgf-hint { color: var(--text-muted); font-size: 12.5px; margin: 0 0 12px; }
.dgf-hint code { font-family: var(--mono-font); font-size: 11.5px; color: var(--mono); }
.dgf-json { width: 100%; min-height: 260px; resize: vertical; font-family: var(--mono-font);
  font-size: 12.5px; line-height: 1.55; background: var(--bg); color: var(--mono);
  border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; }
.dgf-json:focus { outline: none; border-color: var(--accent); }
.dgf-grid { display: flex; flex-direction: column; gap: 12px; }
.dgf-row label { display: flex; align-items: center; gap: 7px; font-size: 12px; margin-bottom: 4px; }
.dgf-name { color: var(--text-strong); font-weight: 500; }
.dgf-type { color: var(--text-muted); font-size: 10.5px; margin-left: auto; font-family: var(--mono-font); }
.dgf-tag { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.04em; padding: 1px 5px; border-radius: 4px; }
.dgf-tag.pk { background: rgba(88,166,255,0.14); color: var(--accent); }
.dgf-tag.req { background: rgba(210,153,34,0.14); color: var(--warning); }
.dgf-inputwrap { display: flex; gap: 6px; }
.dgf-input { flex: 1; height: 34px; background: var(--bg); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--radius); padding: 0 10px; font-size: 13px; }
.dgf-input:focus { outline: none; border-color: var(--accent); }
.dgf-input:read-only, .dgf-input:disabled { background: var(--surface-2); color: var(--text-muted); }
.dgf-inputwrap.is-null .dgf-input { opacity: 0.4; }
.dgf-nullbtn { width: 34px; flex-shrink: 0; border: 1px solid var(--border); background: var(--bg);
  color: var(--text-muted); border-radius: var(--radius); cursor: pointer; font-size: 14px; }
.dgf-nullbtn.on { background: var(--text-muted); color: var(--surface); border-color: var(--text-muted); }

/* confirmation */
#dgConfirmModal { z-index: 160; }
.dg-confirm { max-width: 560px; width: 92%; max-height: 86vh; overflow-y: auto; }
.dgc-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.dgc-badge { font-size: 11px; font-weight: 700; letter-spacing: 0.05em; padding: 2px 9px; border-radius: 5px; }
.dgc-badge.ok { background: rgba(63,185,80,0.16); color: var(--success); }
.dgc-badge.warn { background: rgba(210,153,34,0.16); color: var(--warning); }
.dgc-badge.danger { background: rgba(248,81,73,0.16); color: var(--danger); }
.dgc-target { font-family: var(--mono-font); font-size: 12.5px; color: var(--text-strong); }
.dgc-sql { background: var(--bg); border: 1px solid var(--border); border-left: 3px solid var(--accent);
  border-radius: var(--radius); padding: 11px 13px; font-family: var(--mono-font); font-size: 12px;
  line-height: 1.5; color: var(--mono); white-space: pre-wrap; word-break: break-word; overflow-x: auto; margin: 0 0 12px; }
.dgc-changes { width: 100%; border-collapse: collapse; font-size: 12px; margin: 0 0 12px; }
.dgc-changes th { text-align: left; color: var(--text-muted); font-weight: 500; padding: 4px 8px;
  border-bottom: 1px solid var(--border); font-size: 11px; }
.dgc-changes td { padding: 4px 8px; border-bottom: 1px solid var(--border); vertical-align: top;
  max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
.dgc-note { padding: 9px 12px; border-radius: var(--radius); font-size: 12.5px; }
.dgc-note.ok { background: rgba(63,185,80,0.10); color: var(--success); }
.dgc-note.warn { background: rgba(210,153,34,0.10); color: var(--warning); }
.dgc-note.danger { background: var(--danger-soft, rgba(248,81,73,0.10)); color: var(--danger); font-weight: 500; }

/* ── Query console ── */
.query-input {
  width: 100%; min-height: 120px; resize: vertical;
  font-family: var(--mono-font); font-size: 12.5px; line-height: 1.55;
  background: var(--bg); color: var(--mono);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 10px 12px; transition: border-color 0.15s;
}
.query-input:focus { outline: none; border-color: var(--accent); }
.explain-box {
  display: flex; gap: 10px; align-items: flex-start;
  background: var(--surface-2); border: 1px solid var(--border);
  border-left: 3px solid var(--text-muted); border-radius: var(--radius);
  padding: 10px 12px; font-size: 13px; line-height: 1.6; min-height: 42px;
}
.explain-box .pill { flex-shrink: 0; margin-top: 1px; }
.explain-read { border-left-color: var(--success); }
.explain-write { border-left-color: var(--warning); }
.explain-danger { border-left-color: var(--danger); background: var(--danger-soft); }
.explain-text b { color: var(--text-strong); }
.explain-text code { font-family: var(--mono-font); font-size: 11.5px; color: var(--mono); }
.hist-chip {
  display: block; width: 100%; text-align: left; background: none; border: none;
  padding: 4px 2px; cursor: pointer; color: var(--text-muted);
  border-radius: 4px; overflow: hidden;
}
.hist-chip:hover { color: var(--text); background: var(--surface-hover); }
.hist-chip code { font-family: var(--mono-font); font-size: 11.5px; white-space: nowrap; }
.ctx-line {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  margin-top: 8px; padding: 7px 12px; font-size: 12.5px;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface-2);
}
.ctx-line b { color: inherit; }
.ctx-ok { color: var(--success); border-color: color-mix(in srgb, var(--success) 30%, var(--border)); }
.ctx-ok::before { content: '✓'; font-weight: 700; }
.ctx-warn { color: var(--warning); border-color: color-mix(in srgb, var(--warning) 30%, var(--border)); }
.ctx-warn::before { content: '⚠'; }
.ctx-bad { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, var(--border)); background: var(--danger-soft); }
.ctx-bad::before { content: '✕'; font-weight: 700; }
.ctx-muted { color: var(--text-muted); }
.ctx-muted::before { content: '…'; }
.result-pre {
  font-family: var(--mono-font); font-size: 12px; line-height: 1.55;
  background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 12px; overflow: auto; max-height: 55vh; white-space: pre-wrap; word-break: break-word;
  color: var(--mono);
}

/* ── Divider toolbar on user page ── */
.user-toolbar {
  display: flex; gap: 8px; margin-top: 20px; padding-top: 16px;
  border-top: 1px solid var(--border); flex-wrap: wrap;
}

/* ── Responsive ── */

  .sidebar { display: none; }

<script>
const API = '';
let config = {};
let connected = false;
let currentEngine = '';
let currentView = '';
let cachedUsers = [];
let cachedDbs = [];
let dbData = [];
let dbSort = { key: 'name', dir: 1 };

// ── Custom tooltip (instant, themed — native title is slow and unstyled) ──
const tipEl = document.createElement('div');
tipEl.className = 'tooltip';
document.body.appendChild(tipEl);
function showTip(el) {
  const txt = el.getAttribute('data-tip');
  if (!txt) return;
  tipEl.textContent = txt;
  const r = el.getBoundingClientRect();
  const below = r.top < 46;
  tipEl.classList.toggle('below', below);
  const half = tipEl.offsetWidth / 2;
  const cx = Math.max(half + 6, Math.min(window.innerWidth - half - 6, r.left + r.width / 2));
  tipEl.style.left = cx + 'px';
  tipEl.style.top = (below ? r.bottom : r.top) + 'px';
  tipEl.classList.add('show');
}
function hideTip() { tipEl.classList.remove('show'); }
document.addEventListener('mouseover', e => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (el) showTip(el); else hideTip();   // moving onto anything without a tip clears it
});
document.addEventListener('mousedown', hideTip);
document.addEventListener('scroll', hideTip, true);

// ── Icons (inline SVG, stroke = currentColor) ──
const I = p => `<svg class="ni" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICONS = {
  users: I('<circle cx="9" cy="8" r="3.2"/><path d="M3 19.5c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17.5" cy="9.5" r="2.3"/><path d="M21 19.5c0-2.6-1.7-4.8-4-5.6"/>'),
  search: I('<circle cx="11" cy="11" r="6.2"/><path d="M15.8 15.8L21 21"/>'),
  plus: I('<path d="M12 5v14M5 12h14"/>'),
  key: I('<circle cx="8.5" cy="14.5" r="4"/><path d="M11.5 11.5L20 3M16.5 6.5l3 3"/>'),
  shield: I('<path d="M12 3l7.5 2.8v5.4c0 4.6-3.2 7.7-7.5 9.8-4.3-2.1-7.5-5.2-7.5-9.8V5.8z"/><path d="M8.7 12l2.4 2.4 4.2-4.8"/>'),
  ban: I('<circle cx="12" cy="12" r="8.2"/><path d="M6.3 6.3l11.4 11.4"/>'),
  lock: I('<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8.5 11V7.8a3.5 3.5 0 017 0V11"/>'),
  trash: I('<path d="M4.5 7h15M10 7V4.5h4V7M6.5 7l.9 12.5h9.2L17.5 7M10 11v5M14 11v5"/>'),
  db: I('<ellipse cx="12" cy="5.5" rx="7" ry="2.8"/><path d="M5 5.5v13c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8v-13"/><path d="M5 12c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8"/>'),
  grid: I('<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9.5h16M9.5 9.5V20"/>'),
  scroll: I('<path d="M6.5 3.5h11V20l-2.75-1.8L12 20l-2.75-1.8L6.5 20z"/><path d="M9.5 8h5M9.5 11.5h5"/>'),
  bolt: I('<path d="M13 2L4.5 13.5H11L9.5 22l8.5-11.5H13z"/>'),
  pulse: I('<path d="M3 12h4l2.5-7 4 14 2.5-7h5"/>'),
  term: I('<path d="M4 17l6-5-6-5M12 19h8"/>'),
  sliders: I('<path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="7" cy="18" r="2"/>'),
  unlock: I('<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8.5 11V7.5a3.5 3.5 0 016.7-1.4"/>'),
  close: I('<path d="M6 6l12 12M18 6L6 18"/>'),
  refresh: I('<path d="M20 11.5a8 8 0 10-2.3 5.4"/><path d="M20 5.5v5h-5"/>'),
  rows: I('<rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="M3.5 9.7h17M3.5 14.3h17"/>'),
  copy: I('<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h8"/>'),
  pencil: I('<path d="M4 20l1-4L16 5a2 2 0 012.8 2.8L8 18.7z"/><path d="M14.5 6.5l3 3"/>'),
  chevron: I('<path d="M9 6l6 6-6 6"/>'),
};

const TB_SVG = {
  lockOpen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.8-1.3"/></svg>',
  lockClosed: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
  auto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v18a9 9 0 0 0 0-18z" fill="currentColor" stroke="none"/></svg>',
};

function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function plural(n, word, pluralForm) {
  return `${n} ${n === 1 ? word : (pluralForm || word + 's')}`;
}

function engineFamily(e) {
  e = (e || '').toLowerCase();
  if (e.startsWith('document') || e.includes('mongo')) return 'documentdb';
  if (e.includes('mysql') || e.includes('maria')) return 'mysql';
  if (e.includes('sqlite')) return 'sqlite';
  return 'postgresql';
}

// Pretty display name for an engine key. Only the mongo family gets renamed
// (DocumentDB speaks the Mongo protocol); custom keys like "aurora-mysql" keep
// their own name so the user's own labels survive.
function engineLabel(e) {
  const k = String(e || '');
  if (k.toLowerCase().startsWith('document') || k.toLowerCase().includes('mongo')) return 'MongoDB';
  return k.replace(/_/g, ' ');
}

function fmtSize(bytes) {
  if (bytes == null || isNaN(bytes)) return '—';
  let v = Number(bytes);
  if (v < 1024) return `${Math.round(v)} B`;
  for (const unit of ['KB', 'MB', 'GB', 'TB', 'PB']) {
    v /= 1024;
    if (v < 1024 || unit === 'PB') {
      const digits = v >= 100 ? 0 : v >= 10 ? 1 : 2;
      return `${v.toFixed(digits)} ${unit}`;
    }
  }
}

// ── Preferences & session persistence ──
// One-time storage migration from the tool's earlier name (dbctl.* keys)
(() => {
  for (const store of [localStorage, sessionStorage]) {
    for (const k of Object.keys(store)) {
      if (k.startsWith('dbctl.')) {
        const nk = 'warden.' + k.slice(6);
        if (store.getItem(nk) == null) store.setItem(nk, store.getItem(k));
        store.removeItem(k);
      }
    }
  }
})();

const PREFS_KEY = 'warden.prefs';
const PASS_KEY = 'warden.k';
let prefs = (() => { try { return JSON.parse(localStorage.getItem(PREFS_KEY)) || {}; } catch { return {}; } })();
function savePrefs(patch) {
  prefs = { ...prefs, ...patch };
  try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch {}
}
// Credentials are stored PER TARGET (env + engine): username and remember flag
// in warden.creds, the password under a per-target key. Legacy single-slot
// passwords are kept as a read fallback.
function targetKey() {
  return `${document.getElementById('envSelect')?.value || ''}:${currentEngine}`;
}
function credsStore() { try { return JSON.parse(localStorage.getItem('warden.creds')) || {}; } catch { return {}; } }
function saveTargetCreds(user, remember) {
  const s = credsStore();
  s[targetKey()] = { user, remember: !!remember };
  try { localStorage.setItem('warden.creds', JSON.stringify(s)); } catch {}
}
function targetCreds() { return credsStore()[targetKey()] || null; }

function savePassword(pwd) {
  try {
    const enc = btoa(unescape(encodeURIComponent(pwd)));
    const key = PASS_KEY + '.' + targetKey();
    if (document.getElementById('rememberChk').checked) {
      localStorage.setItem(key, enc); sessionStorage.removeItem(key);
    } else {
      sessionStorage.setItem(key, enc); localStorage.removeItem(key);
    }
  } catch {}
}
function loadPassword() {
  try {
    const key = PASS_KEY + '.' + targetKey();
    const v = sessionStorage.getItem(key) || localStorage.getItem(key)
      || sessionStorage.getItem(PASS_KEY) || localStorage.getItem(PASS_KEY); // legacy slot
    return v ? decodeURIComponent(escape(atob(v))) : '';
  } catch { return ''; }
}
function clearPassword() {
  const key = PASS_KEY + '.' + targetKey();
  sessionStorage.removeItem(key); localStorage.removeItem(key);
  sessionStorage.removeItem(PASS_KEY); localStorage.removeItem(PASS_KEY);
}

async function loadCredsForTarget() {
  // Fill the credential fields for the selected env/engine. Never connects
  // on its own; connecting is always an explicit click.
  const userInput = document.getElementById('adminUser');
  const passInput = document.getElementById('adminPass');
  if (!userInput || !passInput) return;
  renderConnState();
  const sqliteFam = engineFamily(currentEngine) === 'sqlite';
  userInput.disabled = sqliteFam;
  passInput.disabled = sqliteFam;
  document.getElementById('rememberChk').disabled = sqliteFam;
  const kb = document.getElementById('keychainBtn');
  if (kb) kb.style.display = (config.tools?.keychain && !sqliteFam) ? '' : 'none';
  if (sqliteFam) { userInput.value = ''; passInput.value = ''; return; }
  const saved = targetCreds();
  userInput.value = saved?.user || prefs.adminUser || config.defaults?.admin_user || '';
  document.getElementById('rememberChk').checked = saved ? !!saved.remember : !!prefs.remember;
  passInput.value = loadPassword();
  if (!passInput.value && userInput.value.trim()) await keychainAutofill();
}

// ── Theme (system → dark → light) ──
function applyTheme(t) {
  const root = document.documentElement;
  if (t === 'dark' || t === 'light') root.dataset.theme = t;
  else delete root.dataset.theme;
  const btn = document.getElementById('themeBtn');
  if (btn) {
    btn.innerHTML = t === 'dark' ? TB_SVG.moon : t === 'light' ? TB_SVG.sun : TB_SVG.auto;
    btn.title = 'Theme: ' + (t === 'system' ? 'follows system' : t) + ' (click to change)';
  }
}
function cycleTheme() {
  const order = ['system', 'dark', 'light'];
  const next = order[(order.indexOf(prefs.theme || 'system') + 1) % order.length];
  savePrefs({ theme: next });
  applyTheme(next);
}

// ── Environment overlay (browser-local): custom envs, overrides of
//    built-ins, and hidden built-in engines. Sent to the server per-request. ──
const CUSTOM_ENVS_KEY = 'warden.customEnvs';
const HIDDEN_ENVS_KEY = 'warden.hiddenEnvs';
let customEnvs = (() => { try { return JSON.parse(localStorage.getItem(CUSTOM_ENVS_KEY)) || {}; } catch { return {}; } })();
let hiddenEnvs = (() => { try { return JSON.parse(localStorage.getItem(HIDDEN_ENVS_KEY)) || []; } catch { return []; } })();
function saveCustomEnvs() { try { localStorage.setItem(CUSTOM_ENVS_KEY, JSON.stringify(customEnvs)); } catch {} }
function saveHiddenEnvs() { try { localStorage.setItem(HIDDEN_ENVS_KEY, JSON.stringify(hiddenEnvs)); } catch {} }
function isHidden(env, eng) { return hiddenEnvs.includes(env + '/' + eng); }

function envEngines(env) {
  const builtin = (config.environments?.[env] || []).filter(e => !isHidden(env, e));
  const custom = Object.keys(customEnvs[env] || {}).filter(e => !builtin.includes(e));
  return [...builtin, ...custom];
}
function envConfigFor(env, engine) {
  // An entry in customEnvs wins. It's either a custom env or an override of a built-in.
  return customEnvs[env]?.[engine] || null;
}
function envVisible(env) { return envEngines(env).length > 0; }
function renderEnvOptions(selected) {
  const envSel = document.getElementById('envSelect');
  const builtins = Object.keys(config.environments || {});
  const names = [...builtins];
  for (const env of Object.keys(customEnvs)) if (!builtins.includes(env)) names.push(env);
  let html = '';
  for (const env of names) {
    if (!envVisible(env)) continue;
    html += `<option value="${esc(env)}">${esc(env)}</option>`;
  }
  envSel.innerHTML = html;
  if (selected && envVisible(selected)) envSel.value = selected;
}

// ── Autocomplete cache: feeds search dropdowns, quick-jump & badges ──
async function refreshCache() {
  if (!connected) return;
  try {
    const [u, d] = await Promise.all([
      apiPost('/api/list-users'),
      apiPost('/api/list-databases'),
    ]);
    cachedUsers = (u.users || []).map(x => x.user).filter(Boolean).sort();
    cachedDbs = (d.databases || []).map(x => x.name).filter(Boolean).sort();
    document.getElementById('userList').innerHTML = cachedUsers.map(n => `<option value="${esc(n)}">`).join('');
    document.getElementById('dbList').innerHTML = cachedDbs.map(n => `<option value="${esc(n)}">`).join('');
    renderBadges();
  } catch (e) { /* autocomplete is best-effort */ }
}

function renderBadges() {
  const bu = document.getElementById('badge-users');
  const bd = document.getElementById('badge-databases');
  if (bu) bu.textContent = cachedUsers.length || '';
  if (bd) bd.textContent = cachedDbs.length || '';
  if (bu) bu.style.display = cachedUsers.length ? '' : 'none';
  if (bd) bd.style.display = cachedDbs.length ? '' : 'none';
  const ba = document.getElementById('badge-audits');
  if (ba) {
    const n = connected ? auditIssueCount() : 0;
    ba.textContent = n || '';
    ba.style.display = n ? '' : 'none';
    ba.style.color = n ? 'var(--danger)' : '';
  }
}

// ── Init ──
async function init() {
  applyTheme(prefs.theme || 'system');
  const r = await fetch(API + '/api/config');
  config = await r.json();
  const envSel = document.getElementById('envSelect');
  const defaults = config.defaults || {};
  const startEnv =
    (prefs.env && envVisible(prefs.env)) ? prefs.env
    : (defaults.env && envVisible(defaults.env)) ? defaults.env : '';
  renderEnvOptions(startEnv);
  envSel.onchange = () => { savePrefs({ env: envSel.value }); disconnected(); updateEngines(); loadCredsForTarget(); };
  updateEngines(true);

  document.getElementById('adminPass').addEventListener('keydown', e => { if (e.key === 'Enter') testConnection(); });
  document.getElementById('rememberChk').addEventListener('change', e => savePrefs({ remember: e.target.checked }));
  if (config.tools?.keychain) document.getElementById('keychainBtn').style.display = '';
  renderRoBtn();

  // Prefill the saved credentials for this target. Connecting stays manual
  await loadCredsForTarget();
  renderWelcome();
}

function updateEngines(restoring = false) {
  const env = document.getElementById('envSelect').value;
  const engSel = document.getElementById('engineSelect');
  const engines = envEngines(env) || [];
  engSel.innerHTML = '';
  for (const e of engines) {
    engSel.innerHTML += `<option value="${esc(e)}">${esc(engineLabel(e))}</option>`;
  }
  // Keep the currently selected engine when the new env also has it, since
  // switching env shouldn't silently flip postgresql back to documentdb.
  const previous = currentEngine;
  currentEngine = engines.includes(previous) ? previous : (engines[0] || '');
  if (restoring && prefs.engine && engines.includes(prefs.engine)) {
    currentEngine = prefs.engine;
  }
  engSel.value = currentEngine;
  savePrefs({ engine: currentEngine });
  engSel.onchange = () => {
    currentEngine = engSel.value;
    savePrefs({ engine: currentEngine });
    disconnected(); renderNav(); renderWelcome();
    loadCredsForTarget();
  };
  renderNav();
}

// ── Sidebar: data-driven nav ──
function navModel() {
  const fam = engineFamily(currentEngine);
  if (fam === 'sqlite') {
    return [
      { id: 'databases', icon: ICONS.db, label: 'Databases', badge: 'databases' },

    { id: 'audits', icon: ICONS.shield, label: 'Audits', badge: 'audits' },

const VIEWS = {
  users: () => viewListUsers(),
  databases: () => viewDatabases(),
  collections: () => viewCollections(),
  health: () => viewHealth(),
  query: () => viewQuery(),
  audits: () => viewAudits(),
  audit: () => viewAuditLog(),
  envs: () => viewEnvs(),
};

function renderNav() {
  const box = document.getElementById('navSections');
  let html = '';
  for (const item of navModel()) {
    const dis = (connected || item.always) ? '' : 'disabled';
    const badge = item.badge ? `<span class="nav-badge" id="badge-${item.badge}" style="display:none"></span>` : '';
    const tip = dis ? 'Connect to use this' : esc(item.label);
    html += `<button id="nav-${item.id}" class="nav-item" ${dis} data-tip="${tip}"
      onclick="navigate('${item.id}')">${item.icon}<span>${esc(item.label)}</span>${badge}</button>`;
  }
  box.innerHTML = html;
  markActive(currentView);
  renderBadges();
  renderSidebarFoot();
  const qf = document.getElementById('qfInput');
  qf.disabled = !connected;
  qf.placeholder = connected ? 'Jump to user or db…' : 'Connect to search…';
}

function renderSidebarFoot() {
  const foot = document.getElementById('sidebarFoot');
  if (connected) {
    foot.innerHTML = `${ICONS.bolt}<span>${esc(document.getElementById('envSelect').value)} · ${esc(engineLabel(currentEngine))}</span>`;
  } else {
    foot.innerHTML = `${ICONS.lock}<span>connect to unlock operations</span>`;
  }
}

function navigate(id) {
  const fn = VIEWS[id];
  if (!fn) return;
  currentView = id;
  savePrefs({ lastView: id });
  renderNav();
  fn();
}

function markActive(id) {
  document.querySelectorAll('.nav-item.active').forEach(el => el.classList.remove('active'));
  const el = document.getElementById('nav-' + id);
  if (el) el.classList.add('active');
  currentView = id || currentView;
}

// ── Quick-jump search ──
function qfRender() {
  const input = document.getElementById('qfInput');
  const box = document.getElementById('qfResults');
  const q = input.value.trim().toLowerCase();
  if (!q || !connected) { box.classList.remove('open'); box.innerHTML = ''; return; }
  const us = cachedUsers.filter(n => n.toLowerCase().includes(q)).slice(0, 6);
  const ds = cachedDbs.filter(n => n.toLowerCase().includes(q)).slice(0, 6);
  if (!us.length && !ds.length) {
    box.innerHTML = `<div class="qf-hit" style="cursor:default;color:var(--text-muted)">no matches</div>`;
    box.classList.add('open');
    return;
  }
  let html = '';
  for (const n of us) html += `<button class="qf-hit" data-name="${esc(n)}" onclick="qfGo('user', this.dataset.name)">${ICONS.users}<span>${esc(n)}</span><span class="tag">user</span></button>`;
  for (const n of ds) html += `<button class="qf-hit" data-name="${esc(n)}" onclick="qfGo('db', this.dataset.name)">${ICONS.db}<span>${esc(n)}</span><span class="tag">db</span></button>`;
  box.innerHTML = html;
  box.classList.add('open');
}
function qfGo(type, name) {
  const input = document.getElementById('qfInput');
  input.value = '';
  qfRender();
  if (type === 'user') { markActive('users'); viewUserInfoFor(name); }
  else { markActive('databases'); viewCollections(name); }
}
document.addEventListener('DOMContentLoaded', () => {
  const qf = document.getElementById('qfInput');
  qf.addEventListener('input', qfRender);
  qf.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const first = document.querySelector('#qfResults .qf-hit[data-name]');
      if (first) first.click();
    } else if (e.key === 'Escape') { qf.value = ''; qfRender(); qf.blur(); }
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('.qf-wrap')) document.getElementById('qfResults').classList.remove('open');
  });
});

// ── Helpers ──
function creds() {

// ── macOS Keychain (server-mediated) ──
function currentHost() {
  const env = document.getElementById('envSelect').value;
  return envConfigFor(env, currentEngine)?.host
    || config.environment_details?.[env]?.[currentEngine]?.host || '';
}
async function saveToKeychain() {
  const host = currentHost();
  const user = document.getElementById('adminUser').value.trim();
  const password = document.getElementById('adminPass').value;
  if (!host || !user || !password) { toast('Need env, username and password first', 'error'); return; }
  const res = await apiPost('/api/keychain-save', { host, user, password });
  if (res.ok) toast(`Password saved to Keychain for ${user}@${host.split('.')[0]}`, 'success');
  else toast(res.error || 'Keychain save failed', 'error');
}
async function keychainAutofill() {
  if (!config.tools?.keychain) return false;
  const host = currentHost();
  const user = document.getElementById('adminUser').value.trim();
  if (!host || !user || document.getElementById('adminPass').value) return false;
  try {
    const res = await apiPost('/api/keychain-get', { host, user });
    if (res.ok && res.password) {
      document.getElementById('adminPass').value = res.password;
      return true;
    }
  } catch {}
  return false;
}

function requireConnection() {
  if (!connected) {
    toast('Connect first: enter credentials and click Connect', 'error');
    return false;
  }
  return true;
}

async function apiPost(path, extra = {}) {
  const body = { ...creds(), ...extra };
  const r = await fetch(API + path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  return r.json();
}

function toast(msg, type = 'info') {

function disconnected() {

// ── Connection ──
async function testConnection() {
  const u = document.getElementById('adminUser').value.trim();
  const p = document.getElementById('adminPass').value.trim();
  const sqliteFam = engineFamily(currentEngine) === 'sqlite';
  if (!sqliteFam && (!u || !p)) { toast('Enter admin username and password', 'error'); return; }
  const dot = document.getElementById('connDot');
  const txt = document.getElementById('connText');
  dot.className = 'conn-dot'; txt.textContent = 'connecting…';
  const requestTarget = targetKey();
  try {
    const t0 = performance.now();
    const res = await apiPost('/api/connect');
    const rtt = Math.round(performance.now() - t0);
    if (targetKey() !== requestTarget) return; // user switched away mid-connect
    if (res.ok) {
      dot.className = 'conn-dot ok';
      txt.textContent = `${res.user ? res.user + ' @ ' : ''}${res.host || 'connected'} · ${rtt}ms`;
      txt.title = `${res.user || ''} @ ${res.host || ''}, connect round-trip ${rtt}ms`;
      connected = true;
      renderConnState();
      savePrefs({ adminUser: u, env: document.getElementById('envSelect').value, engine: currentEngine });
      saveTargetCreds(u, document.getElementById('rememberChk').checked);
      savePassword(p);
      renderNav();
      toast(`Connected · ${document.getElementById('envSelect').value} / ${engineLabel(currentEngine)}`, 'success');
      refreshCache();
      const ids = navModel().map(i => i.id);
      const landing = (prefs.lastView && ids.includes(prefs.lastView)) ? prefs.lastView : ids[0];
      navigate(landing);
    } else {
      dot.className = 'conn-dot fail';
      txt.textContent = 'auth failed';
      connected = false;
      renderNav();
      toast(res.error || 'Connection failed', 'error');
    }
  } catch (e) {
    dot.className = 'conn-dot fail';
    txt.textContent = 'error';
    connected = false;
    renderNav();
    toast('Server unreachable', 'error');
  }
}

// ── Landing: the Connections page (never a blank screen) ──
function renderWelcome() {
  currentView = 'envs';
  renderNav();
  viewEnvs();
}

// ── Views ──

let allUsers = [];
let usersLoading = false;
// Stale-while-revalidate cache: show the last result instantly, refresh behind it.
const viewCache = new Map();
function cacheKey(kind) { return `${document.getElementById('envSelect')?.value}:${currentEngine}:${kind}`; }
function invalidateCache(kind) { viewCache.delete(cacheKey(kind)); }

async function viewListUsers() {
  if (!requireConnection()) return;
  const key = cacheKey('users');
  const cached = viewCache.get(key);
  allUsers = cached || [];
  usersLoading = !cached;  // first load has no data yet — show a skeleton, not "no users"
  renderUsersShell(!!cached);
  const res = await apiPost('/api/list-users').catch(() => ({ error: 'Request failed' }));
  if (currentView !== 'users' || cacheKey('users') !== key) return;  // navigated away
  usersLoading = false;
  if (res.error) {
    if (!cached) setContent(`<div class="card"><h2>Error</h2><p style="color:var(--danger)">${esc(res.error)}</p></div>`);
    else { const h = document.getElementById('usersRefreshing'); if (h) h.textContent = 'refresh failed'; }
    return;
  }
  allUsers = res.users || [];
  viewCache.set(key, allUsers);
  const h = document.getElementById('usersRefreshing'); if (h) h.style.display = 'none';
  renderUserRows();
}

function renderUsersShell(fromCache) {
  const fam = engineFamily(currentEngine);
  const title = fam === 'mysql' ? 'MySQL Accounts' : fam === 'documentdb' ? 'MongoDB Users' : 'PostgreSQL Users';
  const isDocdb = fam === 'documentdb';
  const cols = isDocdb
    ? '<th>Username</th><th>Auth DB</th><th>Roles</th><th></th>'
    : '<th>Username</th><th>Status</th><th>Flags</th><th>Expires</th><th></th>';
  setContent(`<div class="card"><h2>${ICONS.users} ${title}</h2>
    <div style="display:flex; gap:10px; align-items:center; margin-bottom:12px; flex-wrap:wrap">
      <div class="qf" style="width:260px; height:34px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.2"/><path d="M15.8 15.8L21 21"/></svg>
        <input id="userFilter" placeholder="filter users…" oninput="renderUserRows()" autocomplete="off">
      </div>
      <span id="userCount" style="font-size:12px; color:var(--text-muted)"></span>
      <span id="usersRefreshing" style="font-size:11px; color:var(--text-muted); display:${fromCache ? 'inline' : 'none'}">refreshing…</span>
      <div style="flex:1"></div>
      <button class="btn btn-ghost" onclick="openLookupModal()">${ICONS.search} Look up user</button>
      <button class="btn btn-success" onclick="openCreateUserModal()">${ICONS.plus} Create user</button>
    </div>
    <div class="table-wrap"><table>
      <thead><tr>${cols}</tr></thead>
      <tbody id="userRows"></tbody>
    </table></div></div>`);
  renderUserRows();
}

function renderUserRows() {
  const tbody = document.getElementById('userRows');
  if (!tbody) return;
  const fam = engineFamily(currentEngine);
  const isDocdb = fam === 'documentdb';
  const q = (document.getElementById('userFilter')?.value || '').trim().toLowerCase();
  const list = q ? allUsers.filter(u => u.user.toLowerCase().includes(q)) : allUsers;
  const manage = u => `<div class="row-acts"><button class="ibtn accent" data-tip="Manage user" data-user="${esc(u.user)}" onclick="viewUserInfoFor(this.dataset.user)">${ICONS.sliders}</button></div>`;
  let rows = '';
  for (const u of list) {
    if (isDocdb) {
      const roles = u.roles.map(r => `<span class="pill pill-ok">${esc(r)}</span>`).join(' ');
      rows += `<tr><td class="mono">${esc(u.user)}</td><td>${esc(u.db)}</td>
        <td>${roles || '<span class="pill pill-muted">none</span>'}</td>
        <td style="text-align:right">${manage(u)}</td></tr>`;
    } else {
      const status = u.can_login ? '<span class="pill pill-ok">active</span>' : '<span class="pill pill-danger">disabled</span>';
      const flags = [];
      if (u.superuser) flags.push('superuser');
      if (u.createdb) flags.push('createdb');
      if (u.createrole) flags.push('createrole');
      rows += `<tr><td class="mono">${esc(u.user)}</td><td>${status}</td>
        <td>${flags.join(', ') || '—'}</td>
        <td style="color:var(--text-muted)">${u.valid_until === 'never' ? '—' : esc(u.valid_until)}</td>
        <td style="text-align:right">${manage(u)}</td></tr>`;
    }
  }
  if (!rows && usersLoading) {
    const ncols = isDocdb ? 4 : 5;
    const cell = `<td><div class="skel" style="width:${60 + Math.floor(Math.random()*30)}%"></div></td>`;
    rows = Array.from({ length: 4 }, () =>
      `<tr>${cell.repeat(ncols)}</tr>`).join('');
    tbody.innerHTML = rows;
  } else {
    const empty = q ? 'No users match your filter.' : 'No users on this connection yet.';
    tbody.innerHTML = rows || `<tr><td colspan="5" style="color:var(--text-muted)">${empty}</td></tr>`;
  }
  const c = document.getElementById('userCount');
  if (c) c.textContent = usersLoading ? 'loading…' : (q ? `${list.length} of ${allUsers.length}` : `${allUsers.length} total`);
}

    const status = res.can_login ? '<span class="pill pill-ok">active</span>' : '<span class="pill pill-danger">disabled</span>';
    const flags = [];
    if (res.superuser) flags.push('superuser');
    if (res.createdb) flags.push('createdb');
    if (res.createrole) flags.push('createrole');
    html += `<p style="margin-bottom:8px">${status} &nbsp; Flags: ${flags.join(', ') || 'none'} &nbsp; Expires: ${esc(res.valid_until)} &nbsp; Conn limit: ${esc(res.conn_limit)}</p>`;
    const granted = (res.db_privileges || []).filter(d => d.privileges && d.privileges.length);
    if (granted.length) {
      let dbRows = '';
      for (const d of granted) {
        const btns = d.privileges.map(p => `<button class="btn btn-ghost btn-sm" data-user="${uAttr}" data-priv="${esc(p)}" data-db="${esc(d.database)}"
          onclick="revokePgDbPriv(this.dataset.user, this.dataset.priv, this.dataset.db)">Revoke ${esc(p)}</button>`).join(' ');
        dbRows += `<tr><td class="mono">${esc(d.database)}</td><td>${d.privileges.map(esc).join(', ')}</td><td style="text-align:right">${btns}</td></tr>`;
      }
      html += `<h2 style="margin-top:16px">Database Privileges</h2>
        <div class="table-wrap"><table><thead><tr><th>Database</th><th>Privileges</th><th></th></tr></thead><tbody>${dbRows}</tbody></table></div>`;
    }
    if (res.grants && res.grants.length) {
      let gRows = '';
      for (const g of res.grants) {
        gRows += `<tr><td class="mono">${esc(g.db)}</td><td class="mono">${esc(g.table)}</td><td>${esc(g.privilege)}</td></tr>`;
      }
      html += `<h2 style="margin-top:16px">Table Grants</h2>
        <div class="table-wrap"><table><thead><tr><th>Database</th><th>Table</th><th>Privilege</th></tr></thead><tbody>${gRows}</tbody></table></div>`;
    }
    const privOpts = (config.pg_privileges || []).map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join('');
    html += `<h2 style="margin-top:20px">${ICONS.shield} Grant a Privilege</h2>
      <div class="form-row" style="margin-bottom:0">
        <div class="form-field"><label>Privilege</label><select id="uiGrantPriv">${privOpts}</select></div>
        <div class="form-field"><label>Database</label><input id="uiGrantDb" list="dbList" placeholder="type to search databases…"></div>
        <div class="form-field"><label>Schema</label><input id="uiGrantSchema" value="public"></div>
        <button class="btn btn-success" data-user="${uAttr}" onclick="grantPgPrivDirect(this.dataset.user)">Grant</button>
      </div>`;
  }
  // Management toolbar
  const pgButtons = isDocdb ? '' : (res.can_login
    ? `<button class="btn btn-ghost" data-user="${uAttr}" onclick="toggleLoginDirect(this.dataset.user, false)">🔒 Disable login</button>`
    : `<button class="btn btn-ghost" data-user="${uAttr}" onclick="toggleLoginDirect(this.dataset.user, true)">🔓 Enable login</button>`);
  html += `<div class="user-toolbar">
    <button class="btn btn-primary" data-user="${uAttr}" onclick="openResetModal(this.dataset.user)">🔑 Reset password</button>
    <button class="btn btn-ghost" data-user="${uAttr}" onclick="openTestLoginModal(this.dataset.user, '')">✓ Test access</button>
    ${pgButtons}
    <button class="btn btn-danger" data-user="${uAttr}" onclick="confirmDropUser(this.dataset.user)">🗑️ Drop user</button>
  </div>`;
  html += '</div>';
  showPanel(html);
}

async function doTestLogin() {
  const test_user = document.getElementById('tlUser').value.trim();
  const test_pass = document.getElementById('tlPass').value;
  const test_db = document.getElementById('tlDb').value.trim();
  if (!test_user || !test_pass) { toast('Username and password required', 'error'); return; }
  const box = document.getElementById('tlResult');
  box.innerHTML = loadingInline('Testing login…');
  const base = creds();
  const body = { env: base.env, engine: base.engine, test_user, test_pass };
  if (test_db) body.test_db = test_db;
  if (base.custom_config) body.custom_config = base.custom_config;
  let res;
  try {
    res = await fetch(API + '/api/test-login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(r => r.json());
  } catch (e) {
    box.innerHTML = `<div class="explain-box explain-danger"><div class="explain-text">Request failed: ${esc(e.message)}</div></div>`;
    return;
  }
  if (res.error) { box.innerHTML = `<div class="explain-box explain-danger"><div class="explain-text">${esc(res.error)}</div></div>`; return; }
  if (!res.auth) {
    box.innerHTML = `<div class="explain-box explain-danger"><div class="explain-text"><b>Login failed.</b> ${esc(res.error || 'Those credentials were rejected.')}</div></div>`;
    return;
  }
  let html = `<div class="ctx-line ctx-ok"><b>Login works</b> — authenticated as <span class="mono">${esc(res.identity || test_user)}</span></div>`;
  if (res.roles && res.roles.length) html += `<div style="margin:10px 0 4px; font-size:12.5px"><span style="color:var(--text-muted)">roles: </span>${res.roles.map(r => `<span class="pill pill-ok">${esc(r)}</span>`).join(' ')}</div>`;
  if (res.grants && res.grants.length) html += `<div class="table-wrap" style="margin-top:10px"><table><thead><tr><th>Grants</th></tr></thead><tbody>${res.grants.map(g => `<tr><td class="mono" style="font-size:11px">${esc(g)}</td></tr>`).join('')}</tbody></table></div>`;
  for (const c of (res.checks || [])) {
    html += `<div class="ctx-line ${c.ok ? 'ctx-ok' : 'ctx-bad'}"><b>${esc(c.name)}</b>${c.detail ? ` — <span style="color:var(--text-muted)">${esc(c.detail)}</span>` : ''}</div>`;
  }
  box.innerHTML = html;
}

      <div class="form-field"><label>Privilege</label><select id="revokePriv">${opts}</select></div>
      <div class="form-field"><label>Database (* = all)</label><input id="revokeDb" list="dbList" placeholder="type to search, or *"></div>
    `;
  } else if (isDocdb) {
    const opts = (config.docdb_roles || []).map(r => `<option value="${esc(r)}">${esc(r)}</option>`).join('');
    fields = `
      <div class="form-field"><label>Role</label><select id="revokeRole">${opts}</select></div>
      <div class="form-field"><label>Database</label><input id="revokeDb" list="dbList" placeholder="type to search databases…"></div>
    `;
  } else {
    const opts = (config.pg_privileges || []).map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join('');
    fields = `
      <div class="form-field"><label>Privilege</label><select id="revokePriv">${opts}</select></div>
      <div class="form-field"><label>Database</label><input id="revokeDb" list="dbList" placeholder="type to search databases…"></div>
      <div class="form-field"><label>Schema</label><input id="revokeSchema" value="public"></div>
    `;
  }
  setContent(`<div class="card"><h2>${ICONS.ban} Revoke ${isDocdb ? 'Roles' : 'Privileges'}</h2>
    <div class="form-row">
      <div class="form-field"><label>Username</label><input id="revokeUser" list="userList" placeholder="type to search users…"></div>
      ${fields}
    </div>
    <button class="btn btn-danger" onclick="doRevoke()">Revoke</button>
  </div>`);
  if (prefill && typeof prefill === 'string') document.getElementById('revokeUser').value = prefill;
}

async function doRevoke() {
  const username = document.getElementById('revokeUser').value;
  if (!username) { toast('Username required', 'error'); return; }
  const fam = engineFamily(currentEngine);
  const isDocdb = fam === 'documentdb';
  const extra = {};
  if (fam === 'mysql') {
    extra.privilege = document.getElementById('revokePriv').value;
    extra.database = document.getElementById('revokeDb').value.trim() || '*';
  } else if (isDocdb) {
    extra.roles = [{ role: document.getElementById('revokeRole').value, db: document.getElementById('revokeDb').value }];
  } else {
    extra.privilege = document.getElementById('revokePriv').value;
    extra.database = document.getElementById('revokeDb').value;
    extra.schema = document.getElementById('revokeSchema')?.value || 'public';
  }
  const desc = isDocdb ? `${esc(extra.roles[0].role)} on ${esc(extra.roles[0].db)}` : `${esc(extra.privilege)} on ${esc(extra.database)}`;
  showModal('Confirm Revoke', `<p style="color:var(--danger)">Revoke <strong>${desc}</strong> from <strong>${esc(username)}</strong>?</p>`, [
    { label: 'Cancel', cls: 'btn-ghost' },
    { label: 'Revoke', cls: 'btn-danger', fn: async () => {
      const res = await apiPost('/api/revoke', { username, ...extra });
      if (res.ok) { toast('Revoked', 'success'); }
      else { toast(res.error || 'Failed', 'error'); }
    }},
  ]);
}
