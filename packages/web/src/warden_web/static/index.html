let dbHealth = null;
async function viewDatabases() {
  if (!requireConnection()) return;
  const key = cacheKey('databases');
  const cached = viewCache.get(key);
  if (cached) { dbData = cached.dbData; dbHealth = cached.dbHealth; dbSort = { key: 'size', dir: -1 }; renderDatabases(true); }
  else setContent(loading('Listing databases…'));
  const [health, res] = await Promise.all([
    apiPost('/api/health').catch(() => null),
    apiPost('/api/list-databases').catch(() => ({ error: 'Request failed' })),
  ]);
  if (currentView !== 'databases' || cacheKey('databases') !== key) return;
  if (res.error) { if (!cached) setContent(`<div class="card"><h2>Error</h2><p style="color:var(--danger)">${esc(res.error)}</p></div>`); return; }
  dbData = (res.databases || []).map(d => ({
    ...d,
    bytes: d.size_bytes != null ? Number(d.size_bytes) : Number(d.size_mb || 0) * 1048576,
  }));
  dbHealth = (health && !health.error) ? health : null;
  dbSort = { key: 'size', dir: -1 };
  viewCache.set(key, { dbData, dbHealth });
  renderDatabases(false);
}

function healthStripHtml() {
  if (!dbHealth || !dbHealth.health) return '';
  const h = dbHealth.health, eng = dbHealth.engine;
  const num = v => (typeof v === 'number' && isFinite(v)) ? v : (v != null && v !== '' && !isNaN(v) ? Number(v) : null);
  const chip = (k, v) => v == null || v === '' ? '' : `<div class="chip"><span class="k">${esc(k)}</span><span class="v">${v}</span></div>`;
  let chips = '';
  if (eng === 'documentdb') {
    const c = h.connections || {};
    chips += chip('version', esc(h.version || ''));
    chips += chip('connections', num(c.current) != null ? String(num(c.current)) : '');
    chips += chip('uptime', num(h.uptime) != null ? fmtUptime(h.uptime) : '');
    chips += chip('active ops', num(h.active_ops) != null ? String(h.active_ops) : '');
  } else if (eng === 'mysql') {
    chips += chip('version', esc(h.version || ''));
    chips += chip('connections', h.threads ? `${esc(h.threads)} / ${esc(h.max_connections || '?')}` : '');
    if (h.total_size) chips += chip('size', fmtSize(Number(h.total_size)));
    chips += chip('slow queries', String((h.slow_queries || []).length));
  } else if (eng === 'sqlite') {
    return '';
  } else {
    const conns = h.connections || [];
    chips += chip('version', esc(h.version?.[0] || ''));
    chips += chip('connections', conns.length >= 4 ? `${esc(conns[2])} / ${esc(conns[3])}` : '');
    chips += chip('cache hit', h.cache_hit_pct?.[0] ? `${esc(h.cache_hit_pct[0])}%` : '');
    if (h.total_size?.[0]) chips += chip('size', fmtSize(Number(h.total_size[0])));
  }
  if (!chips.trim()) return '';
  return `<div class="card" style="padding:14px 16px; margin-bottom:14px">
    <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px">
      <span style="font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-muted)">Cluster health</span>
      <div style="flex:1"></div>
      <button class="btn btn-ghost btn-sm" onclick="navigate('health')">Details</button>
    </div>
    <div class="stat-strip" style="margin:0">${chips}</div></div>`;
}

function sortDatabases(key) {
  if (dbSort.key === key) dbSort.dir = -dbSort.dir;
  else dbSort = { key, dir: key === 'size' ? -1 : 1 };
  renderDatabases();
}

function renderDatabases(fromCache) {
  const arrow = k => dbSort.key === k ? `<span class="arrow">${dbSort.dir === 1 ? '▲' : '▼'}</span>` : '';
  const sorted = [...dbData].sort((a, b) => {
    const cmp = dbSort.key === 'size'
      ? a.bytes - b.bytes
      : a.name.toLowerCase().localeCompare(b.name.toLowerCase());
    return cmp * dbSort.dir;
  });
  const maxBytes = Math.max(1, ...dbData.map(d => d.bytes));
  const totalBytes = dbData.reduce((s, d) => s + d.bytes, 0);
  let rows = '';
  for (const d of sorted) {
    const empty = d.empty ? '<span class="pill pill-muted">empty</span>' : '';
    const pct = Math.max(0.5, (d.bytes / maxBytes) * 100);
    rows += `<tr>
      <td class="mono" style="cursor:pointer" data-db="${esc(d.name)}" onclick="viewCollections(this.dataset.db)" data-tip="List ${currentEngine.startsWith('document') ? 'collections' : 'tables'}">${esc(d.name)}</td>
      <td style="white-space:nowrap">${fmtSize(d.bytes)}<div class="sizebar"><div style="width:${pct.toFixed(1)}%"></div></div></td>
      <td>${empty}</td>
    </tr>`;
  }
  setContent(healthStripHtml() + `<div class="card"><h2>${ICONS.db} Databases</h2>
    <p class="card-meta">${dbData.length} databases · ${fmtSize(totalBytes)} total · click a name to browse it${fromCache ? ' · <span style="color:var(--text-muted)">refreshing…</span>' : ''}</p>
    <div class="table-wrap"><table>
      <thead><tr>
        <th class="sortable" onclick="sortDatabases('name')">Name${arrow('name')}</th>
        <th class="sortable" onclick="sortDatabases('size')">Size${arrow('size')}</th>
        <th></th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div></div>`);
}

function viewCollections(prefillDb = '') {
  if (!requireConnection()) return;
  const label = currentEngine.startsWith('document') ? 'collections' : 'tables';
  setContent(`<div class="card"><h2>${ICONS.grid} List ${label}</h2>
    <div class="form-row">
      <div class="form-field"><label>Database</label><input id="collDb" list="dbList" placeholder="type to search databases…"></div>
      <button class="btn btn-primary" onclick="doListCollections()">List</button>
    </div><div id="collResults"></div></div>`);
  if (prefillDb && typeof prefillDb === 'string') {
    document.getElementById('collDb').value = prefillDb;
    doListCollections();
  }
}

async function doListCollections() {
  const database = document.getElementById('collDb').value;
  if (!database) { toast('Database required', 'error'); return; }
  document.getElementById('collResults').innerHTML = loadingInline();
  const res = await apiPost('/api/list-collections', { database });
  const target = document.getElementById('collResults');
  if (!target) return;
  if (res.error) { target.innerHTML = `<p style="color:var(--danger); margin-top:12px">${esc(res.error)}</p>`; return; }
  const act = (icon, cls, db, text, title) => `<button class="ibtn ${cls}" data-tip="${esc(title)}"
    data-db="${esc(db)}" data-q="${esc(text)}" onclick="openQueryWith(this.dataset.db, this.dataset.q)">${icon}</button>`;
  const view = (db, extra) => `<button class="ibtn accent" data-tip="Browse rows &amp; columns"
    data-db="${esc(db)}" ${extra} onclick="openDataGrid(dgSpecFrom(this.dataset))">${ICONS.grid}</button>`;
  if (res.collections) {
    const collRef = c => /^[A-Za-z_$][A-Za-z0-9_$]*$/.test(c) ? `db.${c}` : `db.getCollection(${JSON.stringify(c)})`;
    const rows = res.collections.map(c => `<tr>
      <td class="mono">${esc(c)}</td>
      <td><div class="row-acts">
        ${view(database, `data-coll="${esc(c)}"`)}
        ${act(ICONS.term, 'teal', database, `${collRef(c)}.find({}).limit(5)`, 'Open in query console')}
      </div></td></tr>`).join('');
    target.innerHTML = rows
      ? `<div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>Collection (${res.collections.length})</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`
      : `<div class="empty-state" style="margin-top:12px">No collections in this database</div>`;
  } else if (res.tables) {
    const rows = res.tables.map(t => {
      const full = `"${t.schema}"."${t.table}"`;
      return `<tr>
      <td class="mono">${esc(t.schema)}</td><td class="mono">${esc(t.table)}</td>
      <td style="white-space:nowrap">${t.size_bytes != null ? fmtSize(t.size_bytes) : '—'}</td>
      <td><div class="row-acts">
        ${view(database, `data-schema="${esc(t.schema)}" data-table="${esc(t.table)}"`)}
        ${act(ICONS.term, 'teal', database, `SELECT * FROM ${full} LIMIT 5;`, 'Open in query console')}
      </div></td></tr>`;
    }).join('');
    target.innerHTML = rows
      ? `<div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>Schema</th><th>Table</th><th>Size</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`
      : `<div class="empty-state" style="margin-top:12px">No tables in this database</div>`;
  }
}

// ── Data browser (rows & columns grid) ──
let dg = null;

function dgSpecFrom(ds) {
  const spec = { database: ds.db };
  if (ds.coll) spec.collection = ds.coll;
  else { spec.table = ds.table; if (ds.schema) spec.schema = ds.schema; }
  return spec;
}

function openDataGrid(spec) {
  // spec: {database, collection} (mongo) or {database, schema?, table} (sql)
  if (!requireConnection()) return;
  const name = spec.collection || (spec.schema ? `${spec.schema}.${spec.table}` : spec.table);
  dg = { ...spec, name, limit: 50, offset: 0, total: null, columns: [], rows: [], ids: [],
         loading: true, error: null, search: '', locked: true, meta: null, editable: false,
         filtered: false, estimated: false };
  document.getElementById('dataModal').classList.add('open');
  document.getElementById('dgStats').innerHTML = '';
  renderDgChrome();
  dgFetch();
  dgLoadStats();
}

function dgRefresh() { dgFetch(); dgLoadStats(); }

async function dgLoadStats() {
  if (!dg) return;
  const p = { database: dg.database };
  if (dg.collection) p.collection = dg.collection;
  if (dg.table) { p.table = dg.table; if (dg.schema) p.schema = dg.schema; }
  const res = await apiPost('/api/object-stats', p).catch(() => null);
  const el = document.getElementById('dgStats');
  if (!dg || !el) return;
  if (!res || res.error || !res.stats) { el.innerHTML = ''; return; }
  dg.stats = res.stats;
  el.innerHTML = dgStatCards(res.engine || (dg.collection ? 'documentdb' : 'postgresql'), res.stats);
}

function dgStatCards(engine, s) {
  const card = (k, v) => `<div class="dg-stat"><span class="k">${k}</span><span class="v">${v}</span></div>`;
  const rows = s.rows == null ? '—' : (s.estimated ? '~' : '') + Number(s.rows).toLocaleString();
  const out = [];
  if (engine === 'documentdb') {
    out.push(card('Documents', rows));
    if (s.size_bytes != null) out.push(card('Data size', fmtSize(s.size_bytes)));
    if (s.storage_bytes != null) out.push(card('Storage', fmtSize(s.storage_bytes)));
    if (s.indexes != null) out.push(card('Indexes', s.indexes));
    if (s.avg_obj) out.push(card('Avg document', fmtSize(s.avg_obj)));
  } else {
    out.push(card('Rows', rows));
    if (s.columns != null) out.push(card('Columns', s.columns));
    if (s.size_bytes != null) out.push(card('Size', fmtSize(s.size_bytes)));
    if (s.indexes != null) out.push(card('Indexes', s.indexes));
  }
  return out.join('');
}

function closeDataModal() {
  document.getElementById('dataModal').classList.remove('open');
  ['cellModal', 'dgFormModal', 'dgConfirmModal'].forEach(id => document.getElementById(id).classList.remove('open'));
  dg = null; dgPendingOp = null;
}

async function dgFetch() {
  if (!dg) return;
  dg.loading = true;
  renderDgBody(); renderDgFoot();
  const payload = { database: dg.database, limit: dg.limit, offset: dg.offset };
  if (dg.search) payload.search = dg.search;
  if (dg.collection) payload.collection = dg.collection;
  if (dg.table) { payload.table = dg.table; if (dg.schema) payload.schema = dg.schema; }
  const res = await apiPost('/api/browse-data', payload).catch(() => ({ error: 'Request failed' }));
  if (!dg) return;  // closed mid-flight
  dg.loading = false;
  if (res.error) { dg.error = res.error; }
  else {
    dg.error = null; dg.columns = res.columns || []; dg.rows = res.rows || [];
    dg.ids = res.ids || []; dg.total = res.total;
    dg.filtered = !!res.filtered; dg.estimated = !!res.estimated;
  }
  renderDgBody(); renderDgFoot();
}

async function dgToggleLock() {
  if (!dg) return;
  if (!dg.locked) { dg.locked = true; renderDgChrome(); renderDgBody(); return; }
  if (prefs.readOnly) { toast('Read-only mode is on — turn it off in the top bar to edit', 'error'); return; }
  // Unlocking: fetch metadata so we know the primary key + columns before editing.
  const p = { database: dg.database };
  if (dg.collection) p.collection = dg.collection;
  if (dg.table) { p.table = dg.table; if (dg.schema) p.schema = dg.schema; }
  const meta = await apiPost('/api/table-meta', p).catch(() => ({ error: 'Request failed' }));
  if (!dg) return;
  if (meta.error) { toast(meta.error, 'error'); return; }
  if (!meta.editable) { toast(meta.reason || 'This object cannot be edited', 'error'); return; }
  dg.meta = meta; dg.editable = true; dg.locked = false;
  renderDgChrome(); renderDgBody();
  toast('Editing unlocked — changes are confirmed before they run', 'info');
}

function renderDgChrome() {
  const kind = dg.collection ? 'collection' : 'table';
  const full = `${dg.database}.${dg.name}`;
  document.getElementById('dgTitle').innerHTML =
    `<span class="badge">${kind}</span><span class="name" data-tip="${esc(full)}">${esc(full)}</span>`;
  const lockBtn = dg.locked
    ? `<button class="ibtn" onclick="dgToggleLock()" data-tip="Read-only — click to enable editing">${ICONS.lock}</button>`
    : `<button class="ibtn on" onclick="dgToggleLock()" data-tip="Editing enabled — click to lock (read-only)">${ICONS.unlock}</button>`;
  const addBtn = (!dg.locked && dg.editable)
    ? `<button class="ibtn success" onclick="dgAddRow()" data-tip="Add a row">${ICONS.plus}</button>` : '';
  document.getElementById('dgTools').innerHTML = `
    <div class="dg-search">
      ${ICONS.search}
      <input id="dgSearchInput" placeholder="search…" value="${esc(dg.search)}" autocomplete="off"
        onkeydown="if(event.key==='Enter')dgSearchSubmit();else if(event.key==='Escape'){this.value='';dgClearSearch();}">
      ${dg.search ? `<button class="dg-search-x" onclick="dgClearSearch()" data-tip="Clear search">&times;</button>` : ''}
    </div>
    ${addBtn}
    ${lockBtn}
    <select class="tb-select" onchange="dgSetLimit(this.value)" data-tip="Rows per page">
      ${[25,50,100,200].map(n => `<option value="${n}" ${n===dg.limit?'selected':''}>${n} rows</option>`).join('')}
    </select>
    <button class="ibtn teal" onclick="dgRefresh()" data-tip="Refresh">${ICONS.refresh}</button>`;
}

function dgSearchSubmit() {
  if (!dg) return;
  const v = (document.getElementById('dgSearchInput')?.value || '').trim();
  if (v === dg.search) return;
  dg.search = v; dg.offset = 0;
  renderDgChrome(); dgFetch();
  setTimeout(() => document.getElementById('dgSearchInput')?.focus(), 0);
}
function dgClearSearch() {
  if (!dg || !dg.search) { const i = document.getElementById('dgSearchInput'); if (i) i.value=''; return; }
  dg.search = ''; dg.offset = 0; renderDgChrome(); dgFetch();
}

function dgCellHtml(v) {
  if (v === null || v === undefined) return '<span class="dg-null">NULL</span>';
  const t = typeof v;
  if (t === 'boolean') return `<span class="dg-bool ${v?'t':'f'}">${v}</span>`;
  if (t === 'number') return `<span class="dg-num">${esc(String(v))}</span>`;
  if (t === 'object') return `<span class="dg-json">${esc(JSON.stringify(v))}</span>`;
  return esc(String(v));
}

function renderDgBody() {
  const body = document.getElementById('dgBody');
  if (!body || !dg) return;
  if (dg.error) { body.innerHTML = `<div style="padding:24px; color:var(--danger)">${esc(dg.error)}</div>`; return; }
  const cols = dg.columns;
  const edit = !dg.locked && dg.editable;
  const actH = edit ? '<th class="dg-actcol"></th>' : '';
  if (dg.loading) {
    const nc = cols.length || 5;
    const head = `<thead><tr><th class="dg-corner"></th>${actH}${(cols.length ? cols.map(c=>`<th>${esc(c)}</th>`) : Array.from({length:nc},()=>'<th><div class="skel" style="width:80px"></div></th>')).join('')}</tr></thead>`;
    const rows = Array.from({length:12}, () => `<tr class="dg-skelrow"><td class="dg-rownum"></td>${edit?'<td class="dg-actions"></td>':''}${'<td><div class="skel" style="width:70%"></div></td>'.repeat(nc)}</tr>`).join('');
    body.innerHTML = `<table class="dgrid">${head}<tbody>${rows}</tbody></table>`;
    return;
  }
  if (!dg.rows.length) {
    const what = dg.collection ? 'collection' : 'table';
    body.innerHTML = `<div class="dg-empty" style="padding:24px">${dg.search ? `No rows match “${esc(dg.search)}”.` : `No rows in this ${what}.`}</div>`;
    return;
  }
  const head = `<thead><tr><th class="dg-corner"></th>${actH}${cols.map(c => `<th data-tip="${esc(c)}">${esc(c)}</th>`).join('')}</tr></thead>`;
  const tbody = dg.rows.map((row, r) => {
    const actC = edit ? `<td class="dg-actions"><div class="dg-actwrap">
      <button class="dg-act" data-tip="Edit row" onclick="dgEditRow(${r})">${ICONS.pencil}</button>
      <span class="dg-actsep"></span>
      <button class="dg-act danger" data-tip="Delete row" onclick="dgDeleteRow(${r})">${ICONS.trash}</button>
    </div></td>` : '';
    return `<tr>
      <td class="dg-rownum">${dg.offset + r + 1}</td>${actC}
      ${cols.map((c, ci) => {
        const v = row[ci];
        const big = v !== null && v !== undefined && (typeof v === 'object' || String(v).length > 40);
        return `<td class="${big ? 'dg-cell' : ''}"${big ? ` onclick="dgShowCell(${r},${ci})"` : ''}>${dgCellHtml(v)}</td>`;
      }).join('')}
    </tr>`;
  }).join('');
  body.innerHTML = `<table class="dgrid">${head}<tbody>${tbody}</tbody></table>`;
}

function renderDgFoot() {
  const foot = document.getElementById('dgFoot');
  if (!foot || !dg) return;
  const n = dg.rows.length;
  const from = n ? dg.offset + 1 : 0;
  const to = dg.offset + n;
  let range;
  if (dg.filtered) {
    range = `${from.toLocaleString()}–${to.toLocaleString()} <span class="dg-tag">filtered</span>`;
  } else {
    const totalStr = dg.total != null ? (dg.estimated ? '~' : '') + dg.total.toLocaleString() : '?';
    range = `${from.toLocaleString()}–${to.toLocaleString()} of ${totalStr}`;
  }
  const atEnd = (n < dg.limit) || (!dg.filtered && !dg.estimated && dg.total != null && to >= dg.total);
  foot.innerHTML = `
    <span class="count">${dg.loading ? 'loading…' : `${dg.columns.length} column${dg.columns.length===1?'':'s'}`}${!dg.locked && dg.editable ? ' · <span class="dg-tag warn">editing</span>' : ''}</span>
    <div class="dg-pager">
      <span class="range">${range}</span>
      <button class="btn btn-ghost btn-sm" onclick="dgPage(-1)" ${dg.offset<=0?'disabled':''}>‹ Prev</button>
      <button class="btn btn-ghost btn-sm" onclick="dgPage(1)" ${atEnd?'disabled':''}>Next ›</button>
    </div>`;
}

function dgPage(dir) {
  if (!dg) return;
  const next = dg.offset + dir * dg.limit;
  if (next < 0) return;
  dg.offset = next;
  dgFetch();
}
function dgSetLimit(v) { if (!dg) return; dg.limit = parseInt(v, 10) || 50; dg.offset = 0; renderDgChrome(); dgFetch(); }

let dgCellValue = '';
function dgShowCell(r, c) {
  if (!dg) return;
  const v = dg.rows[r][c];
  dgCellValue = (v !== null && typeof v === 'object') ? JSON.stringify(v, null, 2) : String(v);
  document.getElementById('cellTitle').textContent = `${dg.columns[c]} · row ${dg.offset + r + 1}`;
  document.getElementById('cellBody').textContent = dgCellValue;
  document.getElementById('cellModal').classList.add('open');
}
function dgCopyCell() { navigator.clipboard?.writeText(dgCellValue).then(() => toast('Copied', 'success')).catch(() => {}); }

// ── CRUD: type coercion + previews ──────────────────────────────────────────
function dgPgCat(type) {
  const t = (type || '').toLowerCase();
  if (/\bserial\b|int|bigint|smallint/.test(t) && !/interval/.test(t)) return 'int';
  if (/numeric|decimal|real|double|float|money/.test(t)) return 'float';
  if (/bool/.test(t)) return 'bool';
  if (/json/.test(t)) return 'json';
  return 'text';
}
function dgCoerce(cat, raw) {
  if (cat === 'int') { if (!/^-?\d+$/.test(raw.trim())) throw new Error('must be a whole number'); return parseInt(raw, 10); }
  if (cat === 'float') { const n = Number(raw); if (!isFinite(n)) throw new Error('must be a number'); return n; }
  if (cat === 'bool') { return raw === 'true'; }
  if (cat === 'json') { try { return JSON.parse(raw); } catch { throw new Error('must be valid JSON'); } }
  return raw;
}
function dgVal(v) {  // human-readable value for a preview statement
  if (v === null || v === undefined) return 'NULL';
  if (typeof v === 'number') return String(v);
  if (typeof v === 'boolean') return v ? 'true' : 'false';
  if (typeof v === 'object') return JSON.stringify(v);
  return `'${String(v).replace(/'/g, "''")}'`;
}
function dgMongoIdJs(rep) {
  return (rep && typeof rep === 'object' && '$oid' in rep) ? `ObjectId('${rep.$oid}')` : JSON.stringify(rep);
}
function dgReconstructDoc(r) {
  const o = {};
  dg.columns.forEach((c, i) => { o[c] = dg.rows[r][i]; });
  return o;
}
function dgPgPk(r) {
  const pk = {};
  for (const c of dg.meta.primary_key) pk[c] = dg.rows[r][dg.columns.indexOf(c)];
  return pk;
}

// ── CRUD: forms ─────────────────────────────────────────────────────────────
let dgForm = null;
function dgAddRow() { dgOpenForm('insert', null); }
function dgEditRow(r) { dgOpenForm('edit', r); }

function dgOpenForm(mode, r) {
  if (!dg || dg.locked || !dg.editable) return;
  dgForm = { mode, r };
  const isMongo = !!dg.collection;
  const title = `${mode === 'insert' ? 'Add row to' : 'Edit row in'} ${esc(dg.database)}.${esc(dg.name)}`;
  let bodyHtml;
  if (isMongo) {
    const initial = mode === 'edit' ? JSON.stringify(dgReconstructDoc(r), null, 2) : '{\n  \n}';
    bodyHtml = `<p class="dgf-hint">Edit the document as JSON. ${mode === 'edit' ? 'Only changed fields are written; <code>_id</code> can\'t change.' : 'Leave out <code>_id</code> to let MongoDB assign one.'}</p>
      <textarea id="dgJsonInput" class="dgf-json" spellcheck="false">${esc(initial)}</textarea>`;
  } else {
    bodyHtml = `<div class="dgf-grid">${dgPgFormFields(mode, r)}</div>`;
  }
  document.getElementById('dgFormTitle').textContent = title;
  document.getElementById('dgFormBody').innerHTML = bodyHtml;
  document.getElementById('dgFormSave').textContent = mode === 'insert' ? 'Review insert' : 'Review changes';
  document.getElementById('dgFormModal').classList.add('open');
}

function dgPgFormFields(mode, r) {
  const isEdit = mode === 'edit';
  return dg.meta.columns.map(col => {
    if (!isEdit && col.generated) return '';
    const cat = dgPgCat(col.type);
    const idx = dg.columns.indexOf(col.name);
    const cur = (isEdit && idx >= 0) ? dg.rows[r][idx] : undefined;
    const curNull = isEdit && (cur === null || cur === undefined);   // insert never starts NULL
    const readonly = isEdit && col.is_pk;
    const initStr = (!isEdit || cur === null || cur === undefined) ? '' : (typeof cur === 'object' ? JSON.stringify(cur) : String(cur));
    let input;
    if (cat === 'bool') {
      const opts = [];
      if (!isEdit && col.has_default) opts.push({ v: '', t: '(default)' });
      opts.push({ v: 'true', t: 'true' }, { v: 'false', t: 'false' });
      if (col.nullable) opts.push({ v: '__null__', t: '(null)' });
      const sel = isEdit ? (curNull ? '__null__' : String(cur)) : (col.has_default ? '' : 'false');
      input = `<select class="dgf-input" data-name="${esc(col.name)}" data-cat="bool" data-init="${esc(sel)}" ${readonly?'disabled':''}>
        ${opts.map(o => `<option value="${o.v}" ${o.v===sel?'selected':''}>${o.t}</option>`).join('')}</select>`;
    } else {
      input = `<input class="dgf-input" data-name="${esc(col.name)}" data-cat="${cat}" data-init="${esc(initStr)}"
        value="${esc(initStr)}" ${readonly?'readonly':''}
        placeholder="${!isEdit&&col.has_default?'(default)':(col.nullable?'(empty = NULL)':'')}" autocomplete="off">`;
    }
    const nullToggle = (col.nullable && !readonly && cat !== 'bool')
      ? `<button type="button" class="dgf-nullbtn ${curNull?'on':''}" onclick="dgToggleNull(this)" data-tip="Set NULL">∅</button>` : '';
    const tags = `${col.is_pk?'<span class="dgf-tag pk">PK</span>':''}${(!col.nullable&&!col.has_default)?'<span class="dgf-tag req">required</span>':''}`;
    return `<div class="dgf-row" data-field="${esc(col.name)}" data-null="${curNull?'1':'0'}" data-initnull="${curNull?'1':'0'}">
      <label><span class="dgf-name">${esc(col.name)}</span>${tags}<span class="dgf-type">${esc(col.type)}</span></label>
      <div class="dgf-inputwrap ${curNull?'is-null':''}">${input}${nullToggle}</div>
    </div>`;
  }).join('');
}

function dgToggleNull(btn) {
  const row = btn.closest('.dgf-row');
  const on = row.dataset.null === '1';
  row.dataset.null = on ? '0' : '1';
  btn.classList.toggle('on', !on);
  row.querySelector('.dgf-inputwrap').classList.toggle('is-null', !on);
  const inp = row.querySelector('.dgf-input');
  if (inp && !inp.readOnly) inp.disabled = !on;
}

function dgFormSubmit() {
  if (!dg || !dgForm) return;
  if (dg.collection) return dgFormSubmitMongo();
  return dgFormSubmitPg();
}

function dgFormSubmitPg() {
  const isEdit = dgForm.mode === 'edit';
  const rowEls = [...document.querySelectorAll('#dgFormBody .dgf-row')];
  const out = {};      // insert: all provided; edit: only changed
  const errors = [];
  for (const el of rowEls) {
    const name = el.dataset.field;
    const col = dg.meta.columns.find(c => c.name === name);
    const input = el.querySelector('.dgf-input');
    if (!input) continue;
    if (isEdit && col.is_pk) continue;  // pk is the identifier, never changed here
    const isNull = el.dataset.null === '1';
    const initNull = el.dataset.initnull === '1';
    const cat = input.dataset.cat;
    const raw = input.value;
    const init = input.dataset.init ?? '';
    if (isEdit && isNull === initNull && raw === init) continue;  // unchanged
    let value, omit = false;
    if (cat === 'bool') {
      if (raw === '') omit = true;                       // (default)
      else if (raw === '__null__') value = null;
      else value = raw === 'true';
    } else if (isNull) {
      value = null;
    } else if (raw === '') {
      if (isEdit) {
        if (cat === 'text') value = '';
        else if (col.nullable) value = null;
        else { errors.push(`${name} can't be empty`); continue; }
      } else if (col.has_default || col.nullable) {
        omit = true;                                     // let the DB default / NULL apply
      } else { errors.push(`${name} is required`); continue; }
    } else {
      try { value = dgCoerce(cat, raw); }
      catch (e) { errors.push(`${name}: ${e.message}`); continue; }
    }
    if (!omit) out[name] = value;
  }
  if (errors.length) { toast(errors[0], 'error'); return; }
  if (!Object.keys(out).length) { toast(isEdit ? 'Nothing changed' : 'Nothing to insert', 'error'); return; }
  const mode = dgForm.mode;

  const rel = `${dg.schema || 'public'}.${dg.table}`;
  if (mode === 'insert') {
    const cols = Object.keys(out);
    dgConfirm({
      action: 'insert', danger: false,
      endpoint: '/api/row-insert',
      payload: { database: dg.database, schema: dg.schema, table: dg.table, values: out },
      preview: `INSERT INTO ${rel}\n  (${cols.join(', ')})\nVALUES\n  (${cols.map(c => dgVal(out[c])).join(', ')})`,
      summary: 'Inserts 1 new row.', changes: null, confirmLabel: 'Insert row', successMsg: 'Row inserted',
    });
  } else {
    const pk = dgPgPk(dgForm.r);
    const cols = Object.keys(out);
    const setStr = cols.map(c => `${c} = ${dgVal(out[c])}`).join(',\n      ');
    const whereStr = Object.entries(pk).map(([k, v]) => `${k} = ${dgVal(v)}`).join(' AND ');
    const changeRows = cols.map(c => {
      const idx = dg.columns.indexOf(c);
      return { col: c, from: idx >= 0 ? dg.rows[dgForm.r][idx] : undefined, to: out[c] };
    });
    dgConfirm({
      action: 'update', danger: false,
      endpoint: '/api/row-update',
      payload: { database: dg.database, schema: dg.schema, table: dg.table, pk, changes: out },
      preview: `UPDATE ${rel}\nSET   ${setStr}\nWHERE ${whereStr}`,
      summary: 'Updates exactly 1 row. Previous values are overwritten.',
      changes: changeRows, confirmLabel: 'Save changes', successMsg: 'Row updated',
    });
  }
}

function dgFormSubmitMongo() {
  const mode = dgForm.mode;
  let edited;
  try { edited = JSON.parse(document.getElementById('dgJsonInput').value); }
  catch (e) { toast('Invalid JSON: ' + e.message, 'error'); return; }
  if (typeof edited !== 'object' || Array.isArray(edited) || edited === null) { toast('Document must be a JSON object', 'error'); return; }
  const coll = dg.collection;
  if (mode === 'insert') {
    dgConfirm({
      action: 'insert', danger: false,
      endpoint: '/api/row-insert',
      payload: { database: dg.database, collection: coll, document: edited },
      preview: `db.getCollection('${coll}').insertOne(\n${JSON.stringify(edited, null, 2)}\n)`,
      summary: 'Inserts 1 new document.', changes: null, confirmLabel: 'Insert document', successMsg: 'Document inserted',
    });
  } else {
    const orig = dgReconstructDoc(dgForm.r);
    const set = {}, unset = [];
    for (const k of Object.keys(edited)) {
      if (k === '_id') continue;
      if (JSON.stringify(edited[k]) !== JSON.stringify(orig[k])) set[k] = edited[k];
    }
    for (const k of Object.keys(orig)) { if (k !== '_id' && !(k in edited)) unset.push(k); }
    if (!Object.keys(set).length && !unset.length) { toast('Nothing changed', 'error'); return; }
    const rep = dg.ids[dgForm.r];
    const parts = [];
    if (Object.keys(set).length) parts.push(`$set: ${JSON.stringify(set)}`);
    if (unset.length) parts.push(`$unset: ${JSON.stringify(Object.fromEntries(unset.map(k => [k, ''])))}`);
    dgConfirm({
      action: 'update', danger: false,
      endpoint: '/api/row-update',
      payload: { database: dg.database, collection: coll, id: rep, set, unset },
      preview: `db.getCollection('${coll}').updateOne(\n  { _id: ${dgMongoIdJs(rep)} },\n  { ${parts.join(', ')} }\n)`,
      summary: 'Updates exactly 1 document.',
      changes: [...Object.keys(set).map(k => ({ col: k, from: orig[k], to: set[k] })),
                ...unset.map(k => ({ col: k, from: orig[k], to: undefined, removed: true }))],
      confirmLabel: 'Save changes', successMsg: 'Document updated',
    });
  }
}

function dgDeleteRow(r) {
  if (!dg || dg.locked || !dg.editable) return;
  if (dg.collection) {
    const rep = dg.ids[r];
    dgConfirm({
      action: 'delete', danger: true,
      endpoint: '/api/row-delete',
      payload: { database: dg.database, collection: dg.collection, id: rep },
      preview: `db.getCollection('${dg.collection}').deleteOne(\n  { _id: ${dgMongoIdJs(rep)} }\n)`,
      summary: 'Permanently deletes 1 document. This cannot be undone.',
      changes: null, rowPreview: dgReconstructDoc(r), confirmLabel: 'Delete document', successMsg: 'Document deleted',
    });
  } else {
    const pk = dgPgPk(r);
    const rel = `${dg.schema || 'public'}.${dg.table}`;
    const whereStr = Object.entries(pk).map(([k, v]) => `${k} = ${dgVal(v)}`).join(' AND ');
    dgConfirm({
      action: 'delete', danger: true,
      endpoint: '/api/row-delete',
      payload: { database: dg.database, schema: dg.schema, table: dg.table, pk },
      preview: `DELETE FROM ${rel}\nWHERE ${whereStr}`,
      summary: 'Permanently deletes exactly 1 row. This cannot be undone.',
      changes: null, rowPreview: dgReconstructDoc(r), confirmLabel: 'Delete row', successMsg: 'Row deleted',
    });
  }
}

// ── CRUD: confirmation ──────────────────────────────────────────────────────
let dgPendingOp = null;
function dgConfirm(op) {
  dgPendingOp = op;
  const badge = op.danger
    ? '<span class="dgc-badge danger">DELETE</span>'
    : `<span class="dgc-badge ${op.action==='insert'?'ok':'warn'}">${op.action.toUpperCase()}</span>`;
  let extra = '';
  if (op.changes && op.changes.length) {
    extra = `<table class="dgc-changes"><thead><tr><th>column</th><th>from</th><th>to</th></tr></thead><tbody>${
      op.changes.map(c => `<tr><td class="mono">${esc(c.col)}</td>
        <td>${dgCellHtml(c.from)}</td>
        <td>${c.removed ? '<span class="dg-null">removed</span>' : dgCellHtml(c.to)}</td></tr>`).join('')}</tbody></table>`;
  } else if (op.rowPreview) {
    extra = `<table class="dgc-changes"><tbody>${
      Object.entries(op.rowPreview).map(([k, v]) => `<tr><td class="mono">${esc(k)}</td><td>${dgCellHtml(v)}</td></tr>`).join('')}</tbody></table>`;
  }
  document.getElementById('dgConfirmBody').innerHTML = `
    <div class="dgc-head">${badge}<span class="dgc-target">${esc(dg.database)}.${esc(dg.name)}</span></div>
    <pre class="dgc-sql">${esc(op.preview)}</pre>
    ${extra}
    <div class="dgc-note ${op.danger?'danger':(op.action==='insert'?'ok':'warn')}">${esc(op.summary)}</div>`;
  const btn = document.getElementById('dgConfirmBtn');
  btn.textContent = op.confirmLabel;
  btn.className = 'btn btn-sm ' + (op.danger ? 'btn-danger' : 'btn-success');
  btn.disabled = false;
  document.getElementById('dgConfirmModal').classList.add('open');
}

async function dgConfirmExecute() {
  const op = dgPendingOp;
  if (!op || !dg) return;
  const btn = document.getElementById('dgConfirmBtn');
  btn.disabled = true; btn.textContent = 'Working…';
  const res = await apiPost(op.endpoint, op.payload).catch(() => ({ error: 'Request failed' }));
  if (!res || res.error) {
    toast((res && res.error) || 'Failed', 'error');
    btn.disabled = false; btn.textContent = op.confirmLabel;
    return;
  }
  dgPendingOp = null;
  document.getElementById('dgConfirmModal').classList.remove('open');
  document.getElementById('dgFormModal').classList.remove('open');
  toast(op.successMsg, 'success');
  dgRefresh();  // reflect true DB state (rows + stats)
}
function dgConfirmCancel() { document.getElementById('dgConfirmModal').classList.remove('open'); dgPendingOp = null; }

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  const layers = ['dgConfirmModal', 'cellModal', 'dgFormModal'];
  for (const id of layers) {
    const el = document.getElementById(id);
    if (el && el.classList.contains('open')) { el.classList.remove('open'); if (id==='dgConfirmModal') dgPendingOp=null; return; }
  }
  if (document.getElementById('dataModal').classList.contains('open')) closeDataModal();
});

let auditEntries = [];
let auditFilter = { text: '', action: '' };

async function viewAuditLog() {
  setContent(loading('Reading audit log…'));
  const res = await fetch('/api/audit-log', { method: 'POST', headers: {'Content-Type':'application/json'}, body: '{}' }).then(r => r.json());
  if (!res.entries || !res.entries.length) {
    setContent(`<div class="card"><h2>${ICONS.scroll} Audit Log</h2><div class="empty-state">No audit entries yet. Actions you take here get recorded.</div></div>`);
    return;
  }
  auditEntries = res.entries;
  auditFilter = { text: '', action: '' };
  const chips = ['GRANT', 'REVOKE', 'CREATE', 'DROP', 'QUERY', 'PASSWORD'];
  setContent(`<div class="card"><h2>${ICONS.scroll} Audit Log</h2>
    <p class="card-meta">Last ${res.entries.length} entries (newest first) · stored at ~/.warden/audit.log</p>
    <div style="display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap">
      <div class="qf" style="width:260px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.2"/><path d="M15.8 15.8L21 21"/></svg>
        <input id="auditSearch" placeholder="filter entries…" oninput="auditFilter.text=this.value; renderAuditRows()"></div>
      ${chips.map(c => `<button class="btn btn-ghost btn-sm" id="chip-${c}" onclick="toggleAuditChip('${c}')">${c}</button>`).join('')}
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>Time</th><th>Target</th><th>Action</th><th>Details</th></tr></thead>
      <tbody id="auditRows"></tbody>
    </table></div></div>`);
  renderAuditRows();
}

function toggleAuditChip(action) {
  auditFilter.action = auditFilter.action === action ? '' : action;
  document.querySelectorAll('[id^="chip-"]').forEach(b => b.classList.remove('btn-primary'));
  if (auditFilter.action) document.getElementById('chip-' + auditFilter.action)?.classList.add('btn-primary');
  renderAuditRows();
}

function renderAuditRows() {
  const tbody = document.getElementById('auditRows');
  if (!tbody) return;
  const actionPill = a => {
    const up = a.toUpperCase();
    if (up.includes('DROP') || up.includes('REVOKE') || up.includes('DISABLE')) return `<span class="pill pill-danger">${esc(a)}</span>`;
    if (up.includes('CREATE') || up.includes('GRANT') || up.includes('ENABLE')) return `<span class="pill pill-ok">${esc(a)}</span>`;
    return `<span class="pill pill-warn">${esc(a)}</span>`;
  };
  const text = auditFilter.text.trim().toLowerCase();
  const rows = auditEntries.filter(line => {
    if (text && !line.toLowerCase().includes(text)) return false;
    if (auditFilter.action) {
      const m = line.match(/\]\s+([A-Z ]+?)(?:\s+—|$)/);
      if (!m || !m[1].includes(auditFilter.action)) return false;
    }
    return true;
  }).map(line => {
    const m = line.match(/^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})\s+\[([^\]]+)\]\s+(.*?)(?:\s+—\s+(.*))?$/);
    if (m) {
      return `<tr>
        <td class="mono" style="white-space:nowrap; color:var(--text-muted)">${esc(m[1])}</td>
        <td><span class="pill pill-accent">${esc(m[2])}</span></td>
        <td>${actionPill(m[3])}</td>
        <td class="mono" style="font-size:11.5px">${esc(m[4] || '')}</td>
      </tr>`;
    }
    return `<tr><td colspan="4" class="mono" style="white-space:pre-wrap; font-size:12px">${esc(line)}</td></tr>`;
  }).join('');
  tbody.innerHTML = rows || `<tr><td colspan="4" style="color:var(--text-muted)">No entries match the filter.</td></tr>`;
}

  const t = document.getElementById('qText');
  t.addEventListener('input', qExplainUpdate);
  t.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); runQueryConfirm(); } });
  document.getElementById('qDb').addEventListener('input', qExplainUpdate);
  const live = document.getElementById('qLive');
  live.checked = !!prefs.qLive;
  live.addEventListener('change', () => savePrefs({ qLive: live.checked }));
  qExplainUpdate();
  renderQueryHistory();
}

function querySnippets() {
  const fam = engineFamily(currentEngine);
  if (fam === 'mysql') {
    return [
      { label: 'Latest 10 rows', q: 'SELECT * FROM <table> ORDER BY <id_column> DESC LIMIT 10;' },
      { label: 'Row count (fast estimate)', q: "SELECT table_rows FROM information_schema.tables WHERE table_name = '<table>';" },
      { label: 'Running queries (longest first)', q: "SELECT id, user, time, state, LEFT(info, 100) AS query FROM information_schema.processlist WHERE command <> 'Sleep' ORDER BY time DESC;" },
      { label: 'Biggest tables', q: "SELECT table_schema, table_name, ROUND((data_length + index_length) / 1048576, 1) AS size_mb FROM information_schema.tables WHERE table_schema NOT IN ('information_schema','performance_schema','sys') ORDER BY (data_length + index_length) DESC LIMIT 20;" },
      { label: 'Kill a query by id', q: 'KILL <id>;' },
    ];
  }
  if (fam === 'sqlite') {
    return [
      { label: 'Latest 10 rows', q: 'SELECT * FROM <table> ORDER BY rowid DESC LIMIT 10;' },
      { label: 'Row count', q: 'SELECT COUNT(*) FROM <table>;' },
      { label: 'Table columns', q: "PRAGMA table_info(<table>);" },
      { label: 'All indexes', q: "SELECT name, tbl_name FROM sqlite_master WHERE type = 'index';" },
      { label: 'Integrity check', q: 'PRAGMA integrity_check;' },
    ];
  }
  if (fam === 'documentdb') {
    return [
      { label: 'Find by _id', q: 'db.<collection>.find({ _id: ObjectId("<id>") })' },
      { label: 'Latest 10 documents', q: 'db.<collection>.find({}).sort({ _id: -1 }).limit(10)' },
      { label: 'Count documents (fast estimate)', q: 'db.<collection>.estimatedDocumentCount()' },
      { label: 'List indexes of a collection', q: 'db.<collection>.getIndexes()' },
      { label: 'Currently running operations', q: 'db.adminCommand({ currentOp: 1, active: true })' },
      { label: 'Connection count', q: 'db.adminCommand({ serverStatus: 1 }).connections' },
      { label: 'Database storage stats', q: 'db.runCommand({ dbStats: 1 })' },
    ];
  }
  return [
    { label: 'Latest 10 rows', q: 'SELECT * FROM <table> ORDER BY <id_column> DESC LIMIT 10;' },
    { label: 'Row count (fast estimate)', q: "SELECT reltuples::bigint AS estimated_rows FROM pg_class WHERE relname = '<table>';" },
    { label: 'Active queries (longest first)', q: "SELECT pid, usename, state, now() - query_start AS runtime, left(query, 100) AS query\nFROM pg_stat_activity WHERE state <> 'idle' AND pid <> pg_backend_pid()\nORDER BY runtime DESC NULLS LAST;" },
    { label: 'Biggest tables', q: "SELECT relname AS table, pg_size_pretty(pg_total_relation_size(c.oid)) AS size\nFROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace\nWHERE c.relkind = 'r' AND n.nspname NOT IN ('pg_catalog','information_schema')\nORDER BY pg_total_relation_size(c.oid) DESC LIMIT 20;" },
    { label: 'Connections per database', q: 'SELECT datname, count(*) FROM pg_stat_activity GROUP BY datname ORDER BY count(*) DESC;' },
    { label: 'Blocking locks', q: "SELECT blocked.pid AS blocked_pid, left(blocked.query, 60) AS blocked_query,\n       blocking.pid AS blocking_pid, left(blocking.query, 60) AS blocking_query\nFROM pg_stat_activity blocked\nJOIN pg_locks bl ON bl.pid = blocked.pid AND NOT bl.granted\nJOIN pg_locks gl ON gl.locktype = bl.locktype AND gl.database IS NOT DISTINCT FROM bl.database\n  AND gl.relation IS NOT DISTINCT FROM bl.relation AND gl.granted\nJOIN pg_stat_activity blocking ON blocking.pid = gl.pid;" },
    { label: 'Terminate a query by pid', q: 'SELECT pg_terminate_backend(<pid>);' },
  ];
}

function applySnippet() {
  const sel = document.getElementById('qSnippets');
  const s = querySnippets()[Number(sel.value)];
  sel.value = '';
  if (!s) return;
  const t = document.getElementById('qText');
  t.value = s.q;
  qExplainUpdate();
  t.focus();
}

function runExplain() {
  const t = document.getElementById('qText');
  let q = (t?.value || '').trim().replace(/;+\s*$/, '');
  if (!q) { toast('Type a query first', 'error'); return; }
  const database = document.getElementById('qDb').value.trim();
  if (currentEngine.startsWith('document')) {
    if (!/\.(find|aggregate)\s*\(/.test(q) || /\.explain\s*\(/.test(q)) {
      toast('Explain works on find() / aggregate() queries', 'error');
      return;
    }
    executeQuery(q + '.explain()', database);
  } else {
    executeQuery(/^\s*explain/i.test(q) ? q : 'EXPLAIN ' + q, database);
  }
}

function openQueryWith(db, text) {
  markActive('query');
  viewQuery();
  if (!document.getElementById('qText')) return;
  document.getElementById('qDb').value = db || '';
  document.getElementById('qText').value = text;
  qExplainUpdate();
  executeQuery(text, db || '');
}

let qTimer;
function qExplainUpdate() {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => {
    const box = document.getElementById('qExplain');
    if (!box) return;
    const txt = document.getElementById('qText')?.value || '';
    const ex = explainQuery(currentEngine.startsWith('document'), txt);
    box.className = 'explain-box explain-' + ex.danger;
    box.innerHTML = (DANGER_BADGE[ex.danger] || '') + `<div class="explain-text">${ex.html}</div>`;
    qContextCheck();
  }, 200);
}

// Live target checks: does the db exist, does the collection/table exist

let collCache = {};      // db -> [names] | null (fetch failed)
let collFetching = {};

function extractMongoTarget(text) {
  let rest = (text || '').trim(), db = null;
  const m = rest.match(/^db\.getSiblingDB\(\s*['"]([^'"]+)['"]\s*\)\.([\s\S]*)$/);
  if (m) { db = m[1]; rest = 'db.' + m[2]; }
  const call = parseMongoCall(rest);
  return { db, coll: call ? call.coll : null, method: call ? call.method : null };
}

function extractSqlTable(text) {
  const first = splitTopLevel((text || '').trim(), ';')[0] || '';
  const m = first.match(/\b(?:from|into|update|truncate\s+(?:table\s+)?|join)\s+([a-zA-Z0-9_"]+)/i);
  return m ? m[1].replace(/"/g, '') : null;
}

const ctxLine = (cls, html) => `<div class="ctx-line ctx-${cls}">${html}</div>`;
const ctxSuggest = names => names.slice(0, 3).map(d =>
  `<button class="btn btn-ghost btn-sm" data-db="${esc(d)}" onclick="qSetDb(this.dataset.db)">use ${esc(d)}</button>`).join(' ');

function qSetDb(db) {
  const input = document.getElementById('qDb');
  if (!input) return;
  input.value = db;
  qExplainUpdate();
}

async function fetchColls(db) {
  if (collFetching[db]) return;
  collFetching[db] = true;
  try {
    const res = await apiPost('/api/list-collections', { database: db });
    if (res.collections) collCache[db] = res.collections;
    else if (res.tables) collCache[db] = res.tables.map(t => t.table);
    else collCache[db] = null;
  } catch { collCache[db] = null; }
  collFetching[db] = false;
  qContextCheck();
}

function qContextCheck() {
  const box = document.getElementById('qContext');
  if (!box || !connected) { if (box) box.innerHTML = ''; return; }
  const isDocdb = currentEngine.startsWith('document');
  const txt = document.getElementById('qText')?.value.trim() || '';
  const dbInput = document.getElementById('qDb');
  if (!txt) { box.innerHTML = ''; return; }
  const lines = [];

  let effDb = dbInput.value.trim();
  let target = { coll: null, method: null };
  if (isDocdb) {
    target = extractMongoTarget(txt);
    if (target.db && target.db !== effDb) {
      dbInput.value = target.db;
      effDb = target.db;
      lines.push(ctxLine('ok', `database <b>${esc(target.db)}</b> picked up from the query (getSiblingDB)`));
    }
    if (!effDb) effDb = 'admin';
  } else {
    target.coll = extractSqlTable(txt);
    if (engineFamily(currentEngine) === 'sqlite' && !effDb) effDb = cachedDbs[0] || '';
  }

  // does the database exist on this cluster?
  let dbOk = true;
  if (effDb && cachedDbs.length) {
    if (!cachedDbs.includes(effDb)) {
      dbOk = false;
      const q = effDb.toLowerCase();
      const near = cachedDbs.filter(d => d.toLowerCase().includes(q) || q.includes(d.toLowerCase()));
      lines.push(ctxLine('bad', `database <b>${esc(effDb)}</b> does not exist on this cluster ${near.length ? '· ' + ctxSuggest(near) : ''}`));
    }
  }

  // does the collection/table exist in that database?
  if (target.coll && effDb && dbOk) {
    const colls = collCache[effDb];
    const isInsert = (target.method || '').startsWith('insert');
    if (colls === undefined) {
      fetchColls(effDb);
      lines.push(ctxLine('muted', `checking <b>${esc(target.coll)}</b> in ${esc(effDb)}…`));
    } else if (Array.isArray(colls)) {
      if (colls.includes(target.coll)) {
        lines.push(ctxLine('ok', `<b>${esc(target.coll)}</b> exists in database <b>${esc(effDb)}</b>, the query runs there`));
      } else if (isInsert && isDocdb) {
        lines.push(ctxLine('warn', `<b>${esc(target.coll)}</b> doesn't exist in <b>${esc(effDb)}</b> yet, the insert would CREATE it there`));
      } else {
        const elsewhere = Object.entries(collCache)
          .filter(([d, c]) => Array.isArray(c) && c.includes(target.coll)).map(([d]) => d);
        const stem = target.coll.toLowerCase().replace(/s$/, '');
        const guesses = cachedDbs.filter(d => {
          const dl = d.toLowerCase();
          return dl.includes(stem) || stem.includes(dl);
        }).filter(d => d !== effDb);
        const suggestions = [...new Set([...elsewhere, ...guesses])];
        lines.push(ctxLine('bad',
          `<b>${esc(target.coll)}</b> not found in database <b>${esc(effDb)}</b>, the query would match nothing there ${suggestions.length ? '· ' + ctxSuggest(suggestions) : ''}`));
        for (const g of suggestions.slice(0, 2)) if (collCache[g] === undefined) fetchColls(g);
      }
    }
  }
  box.innerHTML = lines.join('');
}

// Explainer: turns a query into plain english plus a danger level

function preview(v, max = 48) {
  v = String(v == null ? '' : v).trim().replace(/\s+/g, ' ');
  if (v.length > max) v = v.slice(0, max) + '…';
  return `<code>${esc(v)}</code>`;
}

function splitTopLevel(s, sep = ',') {
  const parts = [];
  let cur = '', depth = 0, inStr = null;
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (inStr) { cur += c; if (c === inStr && s[i - 1] !== '\\') inStr = null; continue; }
    if (c === '"' || c === "'" || c === '`') { inStr = c; cur += c; continue; }
    if ('([{'.includes(c)) depth++;
    if (')]}'.includes(c)) depth--;
    if (c === sep && depth === 0) { parts.push(cur); cur = ''; continue; }
    cur += c;
  }
  if (cur.trim()) parts.push(cur);
  return parts.map(p => p.trim());
}

function shallowKeys(objText) {
  objText = (objText || '').trim();
  if (!objText.startsWith('{')) return [];
  const inner = objText.slice(1, objText.lastIndexOf('}'));
  return splitTopLevel(inner).map(pair => {
    const idx = (() => {
      let depth = 0, inStr = null;
      for (let i = 0; i < pair.length; i++) {
        const c = pair[i];
        if (inStr) { if (c === inStr && pair[i - 1] !== '\\') inStr = null; continue; }
        if (c === '"' || c === "'" || c === '`') { inStr = c; continue; }
        if ('([{'.includes(c)) depth++;
        if (')]}'.includes(c)) depth--;
        if (c === ':' && depth === 0) return i;
      }
      return -1;
    })();
    if (idx < 0) return { key: pair.trim().replace(/['"]/g, ''), value: '' };
    return {
      key: pair.slice(0, idx).trim().replace(/['"]/g, ''),
      value: pair.slice(idx + 1).trim(),
    };
  }).filter(kv => kv.key);
}

function kvSummary(objText, max = 4) {
  const kvs = shallowKeys(objText);
  if (!kvs.length) return '';
  const parts = kvs.slice(0, max).map(kv => `<b>${esc(kv.key)}</b> = ${preview(kv.value)}`);
  if (kvs.length > max) parts.push(`+${kvs.length - max} more`);
  return parts.join(', ');
}

function filterDesc(argText, emptyMeansAll) {
  argText = (argText || '').trim();
  if (!argText || /^\{\s*\}$/.test(argText)) {
    return emptyMeansAll ? { html: '<b style="color:var(--danger)">matching EVERY document</b>', all: true } : { html: '(all documents)', all: true };
  }
  const summary = kvSummary(argText);
  return { html: summary ? `where ${summary}` : `matching ${preview(argText, 80)}`, all: false };
}

function updateDesc(argText) {
  const ops = shallowKeys(argText);
  if (!ops.length) return `with ${preview(argText, 80)}`;
  const known = {
    '$set': v => `sets ${kvSummary(v, 5) || preview(v)}`,
    '$unset': v => `removes ${shallowKeys(v).length === 1 ? 'field' : 'fields'} ${shallowKeys(v).map(k => `<b>${esc(k.key)}</b>`).join(', ') || preview(v)}`,
    '$push': v => `appends to ${kvSummary(v)}`,
    '$addToSet': v => `adds to set ${kvSummary(v)}`,
    '$pull': v => `removes matching items from ${kvSummary(v)}`,
    '$inc': v => `increments ${kvSummary(v)}`,
    '$rename': v => `renames ${kvSummary(v)}`,
  };
  const hasOperator = ops.some(o => o.key.startsWith('$'));
  if (!hasOperator) return `<b style="color:var(--danger)">REPLACES the entire document</b> with ${kvSummary(argText) || preview(argText)}`;
  return ops.map(o => known[o.key] ? known[o.key](o.value) : `applies <code>${esc(o.key)}</code> to ${kvSummary(o.value) || preview(o.value)}`).join('; ');
}

function parseMongoCall(rest) {
  const m = rest.match(/^db\.([A-Za-z0-9_$\-]+(?:\.[A-Za-z0-9_$\-]+)*)\.([A-Za-z]+)\s*\(/);
  if (!m) return null;
  let i = m[0].length, depth = 1, inStr = null, args = '';
  for (; i < rest.length && depth > 0; i++) {
    const c = rest[i];
    if (inStr) { if (c === inStr && rest[i - 1] !== '\\') inStr = null; }
    else if (c === '"' || c === "'" || c === '`') inStr = c;
    else if ('([{'.includes(c)) depth++;
    else if (')]}'.includes(c)) { depth--; if (!depth) break; }
    args += c;
  }
  return { coll: m[1], method: m[2], args, tail: rest.slice(i + 1).trim() };
}

function explainMongo(text) {
  let dbNote = '';
  let rest = text;
  const sib = text.match(/^db\.getSiblingDB\(\s*['"]([^'"]+)['"]\s*\)\.([\s\S]*)$/);
  if (sib) { dbNote = ` in database <b>${esc(sib[1])}</b>`; rest = 'db.' + sib[2]; }

  // db-level methods (no collection)
  const dbLevel = rest.match(/^db\.([A-Za-z]+)\s*\(/);
  const call = parseMongoCall(rest);
  if (!call && dbLevel) {
    const dm = dbLevel[1];
    if (dm === 'dropDatabase') return { danger: 'danger', html: `<b style="color:var(--danger)">Deletes the ENTIRE database</b>${dbNote}: every collection and document in it.` };
    if (dm === 'getCollectionNames' || dm === 'stats' || dm === 'getCollectionInfos') return { danger: 'read', html: `Reads database metadata${dbNote} (no data is changed).` };
    if (/^(createUser|updateUser|grantRolesToUser|revokeRolesFromUser|dropUser)$/.test(dm)) return { danger: 'write', html: `Runs the user-management command <code>${esc(dm)}</code>${dbNote}. The Users pages do this with confirmation built in.` };
    if (dm === 'adminCommand' || dm === 'runCommand') return { danger: 'write', html: `Runs a raw database command${dbNote}. Effects depend on the command, review carefully.` };
    return { danger: 'write', html: `Runs <code>db.${esc(dm)}(…)</code>${dbNote}. Review carefully before running.` };
  }
  if (!call) return { danger: 'write', html: `Runs custom JavaScript${dbNote} that could read or modify anything. Review carefully before running.` };

  const { coll, method, args, tail } = call;
  const argList = splitTopLevel(args);
  const collB = `<b>${esc(coll)}</b>`;
  const mods = [];
  const lim = tail.match(/\.limit\(\s*(\d+)\s*\)/); if (lim) mods.push(`at most ${lim[1]} results`);
  if (/\.sort\(/.test(tail)) mods.push('sorted');
  const modTxt = mods.length ? ` (${mods.join(', ')})` : '';

  switch (method) {
    case 'find': case 'findOne': {
      const f = filterDesc(argList[0], false);
      const one = method === 'findOne' ? 'one document' : 'documents';
      return { danger: 'read', html: `<b>Reads</b> ${one} from ${collB}${dbNote} ${f.html}${modTxt}. Nothing is changed.` };
    }
    case 'countDocuments': case 'count': case 'estimatedDocumentCount':
      return { danger: 'read', html: `<b>Counts</b> documents in ${collB}${dbNote} ${filterDesc(argList[0], false).html}. Nothing is changed.` };
    case 'distinct':
      return { danger: 'read', html: `<b>Lists distinct values</b> of ${preview(argList[0])} in ${collB}${dbNote}. Nothing is changed.` };
    case 'aggregate': {
      const writes = /\$out|\$merge/.test(args);
      return writes
        ? { danger: 'danger', html: `Runs an aggregation on ${collB}${dbNote} that <b style="color:var(--danger)">WRITES its results to another collection</b> ($out/$merge).` }
        : { danger: 'read', html: `Runs an <b>aggregation pipeline</b> on ${collB}${dbNote} (${splitTopLevel(argList[0]?.replace(/^\[|\]$/g, '') || '').length || '?'} stages). Nothing is changed.` };
    }
    case 'insertOne':
      return { danger: 'write', html: `<b>Adds one new document</b> to ${collB}${dbNote}: ${kvSummary(argList[0]) || preview(argList[0])}.` };
    case 'insertMany':
      return { danger: 'write', html: `<b>Adds multiple new documents</b> to ${collB}${dbNote}.` };
    case 'updateOne': case 'findOneAndUpdate': {
      const f = filterDesc(argList[0], true);
      return { danger: f.all ? 'danger' : 'write', html: `<b>Updates ONE document</b> in ${collB}${dbNote} ${f.html}: ${updateDesc(argList[1] || '')}.` };
    }
    case 'updateMany': {
      const f = filterDesc(argList[0], true);
      return { danger: f.all ? 'danger' : 'write', html: `<b>Updates ALL documents</b> in ${collB}${dbNote} ${f.html}: ${updateDesc(argList[1] || '')}.` };
    }
    case 'replaceOne': {
      const f = filterDesc(argList[0], true);
      return { danger: 'write', html: `<b style="color:var(--danger)">REPLACES one entire document</b> in ${collB}${dbNote} ${f.html} with ${kvSummary(argList[1]) || preview(argList[1])}.` };
    }
    case 'deleteOne': {
      const f = filterDesc(argList[0], true);
      return { danger: 'danger', html: `<b style="color:var(--danger)">DELETES one document</b> from ${collB}${dbNote} ${f.html}. This cannot be undone.` };
    }
    case 'deleteMany': case 'remove': {
      const f = filterDesc(argList[0], true);
      return { danger: 'danger', html: `<b style="color:var(--danger)">DELETES ${f.all ? 'EVERY document' : 'all matching documents'}</b> from ${collB}${dbNote} ${f.all ? '' : f.html}. This cannot be undone.` };
    }
    case 'drop':
      return { danger: 'danger', html: `<b style="color:var(--danger)">DELETES the entire collection</b> ${collB}${dbNote} and all its documents. This cannot be undone.` };
    case 'createIndex':
      return { danger: 'write', html: `Creates an index on ${collB}${dbNote}: ${preview(argList[0], 80)}.` };
    case 'dropIndex': case 'dropIndexes':
      return { danger: 'danger', html: `<b style="color:var(--danger)">Drops index(es)</b> on ${collB}${dbNote}, which can slow queries down badly.` };
    case 'getIndexes': case 'stats':
      return { danger: 'read', html: `Reads metadata of ${collB}${dbNote}. Nothing is changed.` };
    default:
      return { danger: 'write', html: `Runs <code>${esc(method)}</code> on ${collB}${dbNote}. Not a recognized read operation, review carefully.` };
  }
}

function explainSql(text) {
  const stmts = splitTopLevel(text, ';').map(s => s.trim()).filter(Boolean);
  if (!stmts.length) return { danger: 'none', html: '' };
  const first = stmts[0];
  const kw = (first.match(/^[A-Za-z]+/) || [''])[0].toUpperCase();
  const table = re => { const m = first.match(re); return m ? `<b>${esc(m[1].replace(/"/g, ''))}</b>` : 'a table'; };
  const whereM = first.match(/\bwhere\b([\s\S]+?)(\border\s+by\b|\blimit\b|\bgroup\s+by\b|\breturning\b|$)/i);
  const where = whereM ? ` where ${preview(whereM[1], 90)}` : '';
  const more = stmts.length > 1 ? ` <b>+ ${plural(stmts.length - 1, 'more statement')}</b>, only the first is explained here.` : '';
  const bump = d => (stmts.length > 1 && d === 'read') ? 'write' : d;

  let r;
  switch (kw) {
    case 'SELECT': case 'WITH': case 'EXPLAIN': case 'SHOW':
      r = { danger: 'read', html: `<b>Reads</b> rows from ${table(/\bfrom\s+([a-zA-Z0-9_."]+)/i)}${where || ' (no filter)'}${/\blimit\b/i.test(first) ? '' : where ? '' : ', <b>all rows</b>'}. Nothing is changed.` };
      break;
    case 'INSERT':
      r = { danger: 'write', html: `<b>Adds new rows</b> to ${table(/\binto\s+([a-zA-Z0-9_."]+)/i)}.` };
      break;
    case 'UPDATE': {
      const cols = (first.match(/\bset\b([\s\S]+?)(\bwhere\b|$)/i) || [])[1] || '';
      const colList = splitTopLevel(cols).slice(0, 4).map(c => preview(c, 40)).join(', ');
      r = whereM
        ? { danger: 'write', html: `<b>Updates rows</b> in ${table(/\bupdate\s+([a-zA-Z0-9_."]+)/i)}${where}, setting ${colList}.` }
        : { danger: 'danger', html: `<b style="color:var(--danger)">Updates EVERY row</b> in ${table(/\bupdate\s+([a-zA-Z0-9_."]+)/i)} (no WHERE clause!), setting ${colList}.` };
      break;
    }
    case 'DELETE':
      r = whereM
        ? { danger: 'danger', html: `<b style="color:var(--danger)">DELETES rows</b> from ${table(/\bfrom\s+([a-zA-Z0-9_."]+)/i)}${where}. This cannot be undone.` }
        : { danger: 'danger', html: `<b style="color:var(--danger)">DELETES EVERY row</b> from ${table(/\bfrom\s+([a-zA-Z0-9_."]+)/i)} (no WHERE clause!). This cannot be undone.` };
      break;
    case 'TRUNCATE':
      r = { danger: 'danger', html: `<b style="color:var(--danger)">Removes ALL rows</b> from ${table(/\btruncate\s+(?:table\s+)?([a-zA-Z0-9_."]+)/i)} instantly. This cannot be undone.` };
      break;
    case 'DROP':
      r = { danger: 'danger', html: `<b style="color:var(--danger)">Permanently deletes</b> ${preview(first.replace(/^drop\s+/i, ''), 70)}. This cannot be undone.` };
      break;
    case 'ALTER':
      r = { danger: 'danger', html: `<b>Changes the structure</b> of ${preview(first.replace(/^alter\s+/i, ''), 70)}, which can break applications using it.` };
      break;
    case 'CREATE':
      r = { danger: 'write', html: `<b>Creates</b> ${preview(first.replace(/^create\s+/i, ''), 70)}.` };
      break;
    case 'GRANT': case 'REVOKE':
      r = { danger: 'write', html: `<b>Changes permissions</b>: ${preview(first, 90)}. The Permissions pages do this with confirmation built in.` };
      break;
    case 'VACUUM': case 'ANALYZE': case 'REINDEX':
      r = { danger: 'write', html: `Runs maintenance (<code>${esc(kw)}</code>). Safe for data but can load the server.` };
      break;
    default:
      r = { danger: 'write', html: `Runs <code>${esc(kw || first.slice(0, 20))}</code>. Not a recognized read statement, review carefully.` };
  }
  return { danger: bump(r.danger), html: r.html + more };
}

function explainQuery(isDocdb, text) {
  text = (text || '').trim();
  if (!text) return { danger: 'none', html: '<span style="color:var(--text-muted)">Type a query and a plain-english explanation of what it does will appear here.</span>' };
  return isDocdb ? explainMongo(text) : explainSql(text);
}

// Execution

function runQueryConfirm() {
  const query = document.getElementById('qText').value.trim();
  if (!query) { toast('Query is empty', 'error'); return; }
  const isDocdb = currentEngine.startsWith('document');
  const database = document.getElementById('qDb').value.trim();
  const ex = explainQuery(isDocdb, query);
  if (ex.danger === 'read') { executeQuery(query, database); return; }
  const target = `${esc(creds().env)} / ${esc(engineLabel(currentEngine))} / ${esc(database || (isDocdb ? 'admin' : 'default db'))}`;
  showModal(ex.danger === 'danger' ? '⚠ Destructive Query' : 'Confirm Query', `
    <div class="explain-box explain-${ex.danger}" style="margin-bottom:12px">${DANGER_BADGE[ex.danger]}<div class="explain-text">${ex.html}</div></div>
    <p style="margin-bottom:0">Target: <strong>${target}</strong></p>
  `, [
    { label: 'Cancel', cls: 'btn-ghost' },
    { label: 'Run it', cls: ex.danger === 'danger' ? 'btn-danger' : 'btn-primary', fn: () => executeQuery(query, database) },
  ]);
}

async function executeQuery(query, database) {
  if (document.getElementById('qLive')?.checked) return streamQuery(query, database);
  const box = document.getElementById('qResults');
  if (box) box.innerHTML = loadingInline('Running…');
  const t0 = performance.now();
  const res = await apiPost('/api/query', { query, database });
  const timing = document.getElementById('qTiming');
  if (timing) {
    const mode = res.mode === 'warm' ? ' · ⚡ warm session' : res.mode === 'cold' ? ' · cold start' : '';
    timing.textContent = `${Math.round(performance.now() - t0)} ms · db: ${res.database || ''}${mode}`;
  }
  pushQueryHistory(query);
  renderQueryHistory();
  renderQueryResults(res);
}

async function streamQuery(query, database) {
  const box = document.getElementById('qResults');
  if (!box) return;
  box.innerHTML = `<p class="card-meta" style="margin-bottom:6px">Live output, raw engine stream</p><pre class="result-pre" id="qLivePre"></pre>`;
  const pre = document.getElementById('qLivePre');
  const t0 = performance.now();
  pushQueryHistory(query);
  renderQueryHistory();
  try {
    const resp = await fetch(API + '/api/query-stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...creds(), query, database }),
    });
    if ((resp.headers.get('content-type') || '').includes('json')) {
      const err = await resp.json();
      box.innerHTML = `<div class="explain-box explain-danger"><div class="explain-text"><b>Failed:</b> ${esc(err.error || 'Unknown error')}</div></div>`;
      return;
    }
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      pre.textContent += dec.decode(value, { stream: true });
      pre.scrollTop = pre.scrollHeight;
    }
    if (!pre.textContent.trim()) pre.textContent = '(no output, statement executed)';
  } catch (e) {
    pre.textContent += '\n[stream interrupted: ' + e.message + ']';
  }
  const timing = document.getElementById('qTiming');
  if (timing) timing.textContent = `${Math.round(performance.now() - t0)} ms · live stream`;
}

function jsonCell(v) {
  if (v == null) return '<span style="color:var(--text-muted)">null</span>';
  if (typeof v === 'object') {
    const s = JSON.stringify(v);
    return `<span data-tip="${esc(s.slice(0, 500))}">${esc(s.length > 60 ? s.slice(0, 60) + '…' : s)}</span>`;
  }
  return esc(String(v).length > 120 ? String(v).slice(0, 120) + '…' : String(v));
}

function downloadFile(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

function csvFromDocs(docs) {
  const cols = [];
  for (const d of docs) for (const k of Object.keys(d)) if (!cols.includes(k)) cols.push(k);
  const cell = v => {
    let s = v == null ? '' : typeof v === 'object' ? JSON.stringify(v) : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  return [cols.join(','), ...docs.map(d => cols.map(c => cell(d[c])).join(','))].join('\n');
}

function exportResults(kind) {
  const res = window._qLast;
  if (!res || !res.ok) return;
  const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
  if (res.data !== undefined && res.data !== null) {
    const json = JSON.stringify(res.data, null, 2);
    if (kind === 'copy') { copyText(json); return; }
    if (kind === 'json') { downloadFile(`warden-result-${stamp}.json`, json, 'application/json'); return; }
    if (kind === 'csv') {
      const docs = Array.isArray(res.data) ? res.data : [res.data];
      downloadFile(`warden-result-${stamp}.csv`, csvFromDocs(docs.filter(d => d && typeof d === 'object')), 'text/csv');
      return;
    }
  }
  if (res.csv !== undefined) {
    if (kind === 'copy') { copyText(res.csv); return; }
    if (kind === 'csv') { downloadFile(`warden-result-${stamp}.csv`, res.csv, 'text/csv'); return; }
    if (kind === 'json') {
      const rows = parseCSV(res.csv.trim());
      const docs = rows.slice(1).map(r => Object.fromEntries(rows[0].map((c, i) => [c, r[i]])));
      downloadFile(`warden-result-${stamp}.json`, JSON.stringify(docs, null, 2), 'application/json');
      return;
    }
  }
  copyText(res.output || '');
}

function renderQueryResults(res) {
  const box = document.getElementById('qResults');
  if (!box) return;
  window._qLast = res;
  if (!res.ok) {
    box.innerHTML = `<div class="explain-box explain-danger"><div class="explain-text"><b>Failed:</b> <pre class="result-pre" style="margin-top:8px">${esc(res.error || res.output || 'Unknown error')}</pre></div></div>`;
    return;
  }
  let html = '';
  const hasTabular = (Array.isArray(res.data) && res.data.length) || (res.csv && res.csv.trim());
  if (hasTabular || (res.data !== undefined && res.data !== null)) {
    html += `<div style="display:flex; gap:8px; margin-bottom:8px">
      <button class="btn btn-ghost btn-sm" onclick="exportResults('copy')">Copy</button>
      <button class="btn btn-ghost btn-sm" onclick="exportResults('json')">↓ JSON</button>
      ${hasTabular ? `<button class="btn btn-ghost btn-sm" onclick="exportResults('csv')">↓ CSV</button>` : ''}
    </div>`;
  }
  const trunc = res.truncated ? '<p class="card-meta">Output truncated. Narrow the query for full results.</p>' : '';

  if (res.data !== undefined && res.data !== null) {
    const data = res.data;
    if (Array.isArray(data) && data.length && data.every(d => d && typeof d === 'object' && !Array.isArray(d))) {
      const cols = [];
      for (const d of data.slice(0, 50)) for (const k of Object.keys(d)) if (!cols.includes(k)) cols.push(k);
      const shown = cols.slice(0, 10);
      const rows = data.slice(0, 200).map(d =>
        `<tr>${shown.map(c => `<td class="mono" style="font-size:11.5px">${jsonCell(d[c])}</td>`).join('')}</tr>`).join('');
      html += `<p class="card-meta">${plural(data.length, 'document')}${data.length > 200 ? ', showing first 200' : ''}${cols.length > 10 ? ` · ${plural(cols.length - 10, 'column')} hidden` : ''}</p>
        <div class="table-wrap"><table><thead><tr>${shown.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
    } else if (Array.isArray(data) && !data.length) {
      html += `<div class="empty-state">No documents matched.</div>`;
    } else {
      html += `<pre class="result-pre">${esc(JSON.stringify(data, null, 2))}</pre>`;
    }
  } else if (res.csv !== undefined) {
    const rows = parseCSV(res.csv.trim());
    if (rows.length > 1 && rows[0].length > 0) {
      const head = rows[0], body = rows.slice(1, 201);
      html += `<p class="card-meta">${plural(rows.length - 1, 'row')}${rows.length - 1 > 200 ? ', showing first 200' : ''}</p>
        <div class="table-wrap"><table><thead><tr>${head.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead>
        <tbody>${body.map(r => `<tr>${r.map(c => `<td class="mono" style="font-size:11.5px">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    } else {
      html += `<pre class="result-pre">${esc(res.output.trim() || '(no output, statement executed)')}</pre>`;
    }
    if (res.notices) html += `<pre class="result-pre" style="margin-top:8px; color:var(--text-muted)">${esc(res.notices.trim())}</pre>`;
  } else {
    html += `<pre class="result-pre">${esc((res.output || '').trim() || '(no output)')}</pre>`;
  }
  box.innerHTML = html + trunc;
}

function parseCSV(text) {
  const rows = [];
  let row = [], cur = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else inQ = false; }
      else cur += c;
    }
    else if (c === '"') inQ = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c !== '\r') cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows;
}

// History (localStorage, per engine)

function historyKey() { return 'warden.queryHistory.' + (currentEngine.startsWith('document') ? 'docdb' : 'pg'); }
function pinnedKey() { return 'warden.queryPinned.' + (currentEngine.startsWith('document') ? 'docdb' : 'pg'); }
function loadList(key) { try { return JSON.parse(localStorage.getItem(key)) || []; } catch { return []; } }
function saveList(key, list) { try { localStorage.setItem(key, JSON.stringify(list)); } catch {} }

function pushQueryHistory(q) {
  const h = [q, ...loadList(historyKey()).filter(x => x !== q)].slice(0, 15);
  saveList(historyKey(), h);
}

function togglePin(q) {
  let p = loadList(pinnedKey());
  p = p.includes(q) ? p.filter(x => x !== q) : [q, ...p].slice(0, 10);
  saveList(pinnedKey(), p);
  renderQueryHistory();
}

function renderQueryHistory() {
  const box = document.getElementById('qHistory');
  if (!box) return;
  const pinned = loadList(pinnedKey());
  const recent = loadList(historyKey()).filter(q => !pinned.includes(q));
  window._qHist = [...pinned, ...recent];
  const chip = (q, i, isPinned) => `<div style="display:flex; align-items:center; gap:4px">
    <button class="copy-btn" data-i="${i}" onclick="togglePin(window._qHist[this.dataset.i])" data-tip="${isPinned ? 'Unpin' : 'Pin this query'}" style="font-size:12px">${isPinned ? '★' : '☆'}</button>
    <button class="hist-chip" data-i="${i}" onclick="recallQuery(this.dataset.i)"><code>${esc(q.length > 105 ? q.slice(0, 105) + '…' : q)}</code></button>
  </div>`;
  let html = '';
  if (pinned.length) html += `<div class="group-label" style="padding:14px 0 4px">Pinned</div>` +
    pinned.map((q, i) => chip(q, i, true)).join('');
  if (recent.length) html += `<div class="group-label" style="padding:14px 0 4px">Recent queries</div>` +
    recent.map((q, i) => chip(q, pinned.length + i, false)).join('');
  box.innerHTML = html;
}

function recallQuery(i) {
  const q = (window._qHist || [])[i];
  if (!q) return;
  document.getElementById('qText').value = q;
  qExplainUpdate();
  document.getElementById('qText').focus();
}
