[project]
name = "warden-web"
version = "1.0.0"
description = "warden web UI and HTTP API (stdlib server, zero runtime dependencies)"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "warden-core",
]

[project.scripts]
warden-web = "warden_web.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warden_web"]

[tool.uv.sources]
warden-core = { workspace = true }
