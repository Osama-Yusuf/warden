[project]
name = "warden-core"
version = "1.0.0"
description = "Shared engine for warden: environments, validation, audit, DocumentDB and PostgreSQL primitives"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "pymongo>=4",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "redis>=5",
    "urllib3>=2",
]

# On-device AI models (the "download & go" tier). Optional: warden runs fine
# without it, and Ward degrades to a plain message until it's installed.
#   uv pip install "warden-core[local]"   (or install llama-cpp-python directly)
[project.optional-dependencies]
local = ["llama-cpp-python>=0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warden_core"]
