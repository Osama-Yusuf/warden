[project]
name = "warden-desktop"
version = "1.0.0"
description = "warden as a native desktop app (pywebview shell around warden-web)"
requires-python = ">=3.9"
dependencies = [
    "warden-web",
    "pywebview>=5",
]

[project.optional-dependencies]
build = ["pyinstaller>=6"]

[project.scripts]
warden-desktop = "warden_desktop.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warden_desktop"]

[tool.uv.sources]
warden-web = { workspace = true }
