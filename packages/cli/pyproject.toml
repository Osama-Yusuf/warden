[project]
name = "warden-cli"
version = "1.0.0"
description = "warden terminal client (interactive menus + scriptable subcommands)"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "warden-core",
    "rich>=13",
]

[project.scripts]
warden = "warden_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warden_cli"]

[tool.uv.sources]
warden-core = { workspace = true }
