name: test

# `runs-on` is the repo variable RUNNER_LABEL, not a literal. Unset it and jobs
# run on GitHub's paid runners (ubuntu-latest); set it to `self-hosted` and they
# run on the local Docker fleet from scripts/runner-up. Switching is not a commit:
#
#   scripts/runner-up                                 # start the local fleet
#   gh variable set RUNNER_LABEL --body self-hosted   # ours
#   gh variable delete RUNNER_LABEL                   # back to GitHub's
#
# Note: pull_request runs use the workflow file from the PR's own branch, so a
# branch cut before this change ignores the variable until it's rebased on main.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Python unit tests
        run: uv run pytest -q

  js:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smart-filter unit tests
        run: node --test 'tests/js/*.test.mjs'

  integration:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    # No `services:` here on purpose. On GitHub's runners this job would spin up
    # its own DB containers, but on the local box that meant four databases doing
    # a fresh init at once inside OrbStack's VM, where mariadb's --initialize is
    # flaky (io_uring is restricted) and the load destabilises the runner. The
    # self-hosted runner uses host networking, so it reaches the dev containers
    # that `tests/engines/docker-compose.yml` already keeps running and healthy on
    # the standard ports. Bring them up first (`docker compose -f
    # tests/engines/docker-compose.yml up -d`); a test whose engine is unreachable
    # skips rather than fails, so a stopped stack shows as skips, not red.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: MariaDB client (warden shells out to `mysql`)
        run: sudo apt-get update && sudo apt-get install -y mariadb-client
      - run: uv sync
      - name: Integration tests (connect / list / browse per engine)
        run: uv run pytest -m integration -v
